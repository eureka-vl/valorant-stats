const SIDE_LABEL = { attack: 'アタック', defense: 'ディフェンス', total: 'トータル' };

function siteLabel(site) {
  return site === 'None' ? '設置なし' : `${site}サイト`;
}

// ---------- Core single-match computation ----------

function detectHalfAttacker(roundsArr) {
  const counts = {};
  for (let i = 0; i < Math.min(12, roundsArr.length); i++) {
    const pb = roundsArr[i] && roundsArr[i].plant_events && roundsArr[i].plant_events.planted_by;
    if (pb && pb.team) counts[pb.team] = (counts[pb.team] || 0) + 1;
  }
  let best = null, max = 0;
  Object.entries(counts).forEach(([team, cnt]) => { if (cnt > max) { max = cnt; best = team; } });
  if (best) return best;

  const counts2 = {};
  for (let i = 12; i < Math.min(24, roundsArr.length); i++) {
    const pb = roundsArr[i] && roundsArr[i].plant_events && roundsArr[i].plant_events.planted_by;
    if (pb && pb.team) counts2[pb.team] = (counts2[pb.team] || 0) + 1;
  }
  let best2 = null, max2 = 0;
  Object.entries(counts2).forEach(([team, cnt]) => { if (cnt > max2) { max2 = cnt; best2 = team; } });
  if (best2) return best2 === 'Red' ? 'Blue' : 'Red';

  return 'Red';
}

function attackerForRound(roundNum1based, half1Attacker, roundData) {
  const pb = roundData && roundData.plant_events && roundData.plant_events.planted_by;
  if (pb && pb.team) return pb.team;
  const half2Attacker = half1Attacker === 'Red' ? 'Blue' : 'Red';
  if (roundNum1based <= 12) return half1Attacker;
  if (roundNum1based <= 24) return half2Attacker;
  const otIdx = roundNum1based - 24;
  return otIdx % 2 === 1 ? half1Attacker : half2Attacker;
}

const ROUND_TYPE_ORDER = ['Pistol', 'Eco', 'Force Buy', 'Full Buy', 'Anti-Eco'];
const ROUND_TYPE_LABEL_JA = { Pistol: 'ピストル', Eco: 'エコ', 'Force Buy': 'フォース', 'Full Buy': 'フルバイ', 'Anti-Eco': 'アンチエコ' };

function classifyRoundType(roundNum1based, avgLoadout) {
  const isPistol = roundNum1based === 1 || roundNum1based === 13;
  if (isPistol) return 'Pistol';
  if (avgLoadout < 2000) return 'Eco';
  if (avgLoadout < 3400) return 'Force Buy';
  return 'Full Buy';
}

function computeRoundTypeBreakdown(roundsArr) {
  const overall = {};
  const byTeam = {};
  ROUND_TYPE_ORDER.forEach(t => { overall[t] = { rounds: 0, wins: 0 }; });

  roundsArr.forEach((r, i) => {
    const roundNum = i + 1;
    const avgByTeam = {};
    ['Red', 'Blue'].forEach(team => {
      const loadouts = (r.player_stats || [])
        .filter(ps => ps.player_team === team)
        .map(ps => (ps.economy && ps.economy.loadout_value) || 0);
      avgByTeam[team] = loadouts.length ? loadouts.reduce((a, b) => a + b, 0) / loadouts.length : null;
    });

    ['Red', 'Blue'].forEach(team => {
      const opponent = team === 'Red' ? 'Blue' : 'Red';
      const avg = avgByTeam[team];
      if (avg === null) return;
      let type = classifyRoundType(roundNum, avg);
      // Anti-eco: this team is full-buying into an opponent who is eco'ing
      if (type === 'Full Buy' && avgByTeam[opponent] !== null && classifyRoundType(roundNum, avgByTeam[opponent]) === 'Eco') {
        type = 'Anti-Eco';
      }
      const won = r.winning_team === team ? 1 : 0;

      if (!overall[type]) overall[type] = { rounds: 0, wins: 0 };
      overall[type].rounds += 1;
      overall[type].wins += won;

      const key = team + '_' + type;
      if (!byTeam[key]) byTeam[key] = { rounds: 0, wins: 0 };
      byTeam[key].rounds += 1;
      byTeam[key].wins += won;
    });
  });

  const overallOut = {};
  Object.entries(overall).forEach(([type, s]) => {
    overallOut[type] = { rounds: s.rounds, wins: s.wins, win_rate: s.rounds ? Math.round((100 * s.wins / s.rounds) * 10) / 10 : 0 };
  });
  const byTeamOut = {};
  Object.entries(byTeam).forEach(([key, s]) => {
    byTeamOut[key] = { rounds: s.rounds, wins: s.wins, win_rate: s.rounds ? Math.round((100 * s.wins / s.rounds) * 10) / 10 : 0 };
  });

  return { overall: overallOut, by_team: byTeamOut };
}

// ---------- Post-plant positioning (defender distance from the spike) ----------

const DIST_BAND_ORDER = ['Close', 'Mid', 'Far'];
const DIST_BAND_LABEL_JA = { Close: 'クロース', Mid: 'ミッド', Far: 'ファー' };
const DIST_BAND_THRESHOLDS = { close: 2500, mid: 5000 }; // game units

function classifyDistanceBand(dist) {
  if (dist < DIST_BAND_THRESHOLDS.close) return 'Close';
  if (dist < DIST_BAND_THRESHOLDS.mid) return 'Mid';
  return 'Far';
}

function computePostPlantData(roundsArr, playersMeta) {
  const perRound = [];
  const bandTotals = { Close: 0, Mid: 0, Far: 0 };
  let closePresentWins = 0, closePresentRounds = 0;
  let closeAbsentWins = 0, closeAbsentRounds = 0;
  // 設置時点の人数状況（生存人数）の集計
  const stateMap = {};
  const diffGroups = { adv: { rounds: 0, wins: 0 }, even: { rounds: 0, wins: 0 }, dis: { rounds: 0, wins: 0 } };
  const teamAgg = {};
  let atkAliveSum = 0, defAliveSum = 0;

  roundsArr.forEach((r, i) => {
    const pe = r.plant_events;
    if (!pe || !pe.plant_location || !pe.planted_by) {
      perRound.push(null);
      return;
    }
    const plantLoc = pe.plant_location;
    const atkTeam = pe.planted_by.team;
    const locs = pe.player_locations_on_plant || [];

    const defenders = [];
    const attackers = [];
    locs.forEach(loc => {
      const dx = loc.location.x - plantLoc.x;
      const dy = loc.location.y - plantLoc.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const band = classifyDistanceBand(dist);
      const entry = {
        puuid: loc.player_puuid, name: loc.player_display_name, team: loc.player_team,
        x: loc.location.x, y: loc.location.y, dist: Math.round(dist), band,
      };
      if (loc.player_team === atkTeam) attackers.push(entry);
      else defenders.push(entry);
    });

    const closeCount = defenders.filter(d => d.band === 'Close').length;
    defenders.forEach(d => { bandTotals[d.band] += 1; });

    const attackerWon = r.winning_team === atkTeam;

    // 人数状況: player_locations_on_plant には設置時点の生存者だけが入っている（キルログと照合済み）
    const atkAlive = attackers.length, defAlive = defenders.length;
    const diff = atkAlive - defAlive;
    const grp = diff > 0 ? 'adv' : diff < 0 ? 'dis' : 'even';
    const sk = atkAlive + 'v' + defAlive;
    if (!stateMap[sk]) stateMap[sk] = { atk: atkAlive, def: defAlive, rounds: 0, wins: 0 };
    stateMap[sk].rounds += 1; if (attackerWon) stateMap[sk].wins += 1;
    diffGroups[grp].rounds += 1; if (attackerWon) diffGroups[grp].wins += 1;
    atkAliveSum += atkAlive; defAliveSum += defAlive;
    if (!teamAgg[atkTeam]) teamAgg[atkTeam] = { rounds: 0, wins: 0, atkSum: 0, defSum: 0, adv: { rounds: 0, wins: 0 }, even: { rounds: 0, wins: 0 }, dis: { rounds: 0, wins: 0 } };
    const ta = teamAgg[atkTeam];
    ta.rounds += 1; ta.atkSum += atkAlive; ta.defSum += defAlive;
    ta[grp].rounds += 1;
    if (attackerWon) { ta.wins += 1; ta[grp].wins += 1; }

    if (closeCount > 0) {
      closePresentRounds += 1;
      if (attackerWon) closePresentWins += 1;
    } else {
      closeAbsentRounds += 1;
      if (attackerWon) closeAbsentWins += 1;
    }

    perRound.push({
      round: i, site: pe.plant_site, plantLocation: plantLoc, attackTeam: atkTeam,
      winningTeam: r.winning_team, defenders, attackers, closeCount,
      atkAlive, defAlive, plantTime: pe.plant_time_in_round != null ? pe.plant_time_in_round : null,
    });
  });

  const roundsWithPlant = perRound.filter(Boolean).length;
  const bandTotalSum = bandTotals.Close + bandTotals.Mid + bandTotals.Far;
  const bandDistribution = {};
  DIST_BAND_ORDER.forEach(b => {
    bandDistribution[b] = {
      count: bandTotals[b],
      share: bandTotalSum ? Math.round((100 * bandTotals[b] / bandTotalSum) * 10) / 10 : 0,
    };
  });

  const pcRate = (w, n) => n ? Math.round((100 * w / n) * 10) / 10 : 0;
  const pcAvg = (sum, n) => n ? Math.round((sum / n) * 10) / 10 : 0;
  const pcGroup = (g) => ({ rounds: g.rounds, wins: g.wins, win_rate: pcRate(g.wins, g.rounds) });
  const pcByTeam = {};
  Object.entries(teamAgg).forEach(([team, t]) => {
    pcByTeam[team] = {
      rounds: t.rounds, wins: t.wins, win_rate: pcRate(t.wins, t.rounds),
      avgAtk: pcAvg(t.atkSum, t.rounds), avgDef: pcAvg(t.defSum, t.rounds),
      adv: pcGroup(t.adv), even: pcGroup(t.even), dis: pcGroup(t.dis),
    };
  });
  const playerCount = {
    rounds: roundsWithPlant,
    avgAtk: pcAvg(atkAliveSum, roundsWithPlant), avgDef: pcAvg(defAliveSum, roundsWithPlant),
    byDiff: { adv: pcGroup(diffGroups.adv), even: pcGroup(diffGroups.even), dis: pcGroup(diffGroups.dis) },
    byState: Object.values(stateMap)
      .map(st => ({ ...st, diff: st.atk - st.def, win_rate: pcRate(st.wins, st.rounds) }))
      .sort((a, b) => (b.diff - a.diff) || (b.atk - a.atk)),
    byTeam: pcByTeam,
  };

  return {
    perRound,
    roundsWithPlant,
    playerCount,
    bandDistribution,
    closeCompare: {
      present: { rounds: closePresentRounds, wins: closePresentWins, win_rate: closePresentRounds ? Math.round((100 * closePresentWins / closePresentRounds) * 10) / 10 : 0 },
      absent: { rounds: closeAbsentRounds, wins: closeAbsentWins, win_rate: closeAbsentRounds ? Math.round((100 * closeAbsentWins / closeAbsentRounds) * 10) / 10 : 0 },
    },
  };
}


function normalizeTs(v) {
  if (typeof v !== 'number' || !v) return null;
  return v > 1e12 ? v : v * 1000; // seconds -> ms
}

function buildDashboardData(json) {
  const m = json && json.data && json.data[0];
  if (!m) throw new Error('対応していない形式です（data[0] が見つかりません）');
  const allPlayers = m.players && m.players.all_players;
  if (!allPlayers || !allPlayers.length) throw new Error('players.all_players が見つかりません');
  const roundsArr = m.rounds || [];
  const killsArr = m.kills || [];
  const roundsPlayed = (m.metadata && m.metadata.rounds_played) || roundsArr.length;

  const playersMeta = {};
  allPlayers.forEach(p => {
    playersMeta[p.puuid] = {
      puuid: p.puuid, name: p.name, tag: p.tag, team: p.team, character: p.character,
      rank: p.currenttier_patched,
    };
  });

  const half1Attacker = detectHalfAttacker(roundsArr);

  const blankSide = () => ({
    rounds: 0, kills: 0, deaths: 0, assists: 0, score: 0,
    damage_made: 0, damage_received: 0,
    headshots: 0, bodyshots: 0, legshots: 0, fk: 0, fd: 0,
  });

  const sideStats = {};
  Object.keys(playersMeta).forEach(pid => { sideStats[pid] = { attack: blankSide(), defense: blankSide() }; });

  const assistsByRoundPlayer = {};
  const killsByRound = {};
  // 「キル」は敵チームの相手を倒したものだけ（自滅・チームキルは除外。ゲームの公式スコアボードと同じ基準）
  const isEnemyKill = (k) => {
    const a = playersMeta[k.killer_puuid], b = playersMeta[k.victim_puuid];
    return !!(a && b && k.killer_puuid !== k.victim_puuid && a.team !== b.team);
  };
  const enemyKillCount = {};
  killsArr.forEach(k => {
    const rnd = k.round;
    if (!killsByRound[rnd]) killsByRound[rnd] = [];
    killsByRound[rnd].push(k);
    if (isEnemyKill(k)) {
      const key = rnd + '_' + k.killer_puuid;
      enemyKillCount[key] = (enemyKillCount[key] || 0) + 1;
    }
    (k.assistants || []).forEach(a => {
      const key = rnd + '_' + a.assistant_puuid;
      assistsByRoundPlayer[key] = (assistsByRoundPlayer[key] || 0) + 1;
    });
  });

  roundsArr.forEach((r, i) => {
    const roundNum = i + 1;
    const atkTeam = attackerForRound(roundNum, half1Attacker, r);

    const dmgReceivedThisRound = {};
    (r.player_stats || []).forEach(ps => {
      const dealer = ps.player_puuid;
      (ps.damage_events || []).forEach(de => {
        if (de.receiver_puuid === dealer) return;
        dmgReceivedThisRound[de.receiver_puuid] = (dmgReceivedThisRound[de.receiver_puuid] || 0) + de.damage;
      });
    });

    (r.player_stats || []).forEach(ps => {
      const pid = ps.player_puuid;
      if (!playersMeta[pid]) return;
      const team = playersMeta[pid].team;
      const side = team === atkTeam ? 'attack' : 'defense';
      const s = sideStats[pid][side];
      s.rounds += 1;
      s.kills += killsArr.length ? (enemyKillCount[i + '_' + pid] || 0) : (ps.kills || 0);
      s.score += ps.score || 0;
      s.damage_made += ps.damage || 0;
      s.damage_received += dmgReceivedThisRound[pid] || 0;
      s.headshots += ps.headshots || 0;
      s.bodyshots += ps.bodyshots || 0;
      s.legshots += ps.legshots || 0;
      s.assists += assistsByRoundPlayer[i + '_' + pid] || 0;
    });

    const killsThisRound = killsByRound[i] || [];
    killsThisRound.forEach(k => {
      const vpid = k.victim_puuid;
      if (playersMeta[vpid]) {
        const team = playersMeta[vpid].team;
        const side = team === atkTeam ? 'attack' : 'defense';
        sideStats[vpid][side].deaths += 1;
      }
    });
    const enemyKillsThisRound = killsThisRound.filter(isEnemyKill);
    if (enemyKillsThisRound.length) {
      const first = [...enemyKillsThisRound].sort((a, b) => a.kill_time_in_round - b.kill_time_in_round)[0];
      const kpid = first.killer_puuid, vpid = first.victim_puuid;
      if (playersMeta[kpid]) {
        const team = playersMeta[kpid].team;
        const side = team === atkTeam ? 'attack' : 'defense';
        sideStats[kpid][side].fk += 1;
      }
      if (playersMeta[vpid]) {
        const team = playersMeta[vpid].team;
        const side = team === atkTeam ? 'attack' : 'defense';
        sideStats[vpid][side].fd += 1;
      }
    }
  });

  const teams = m.teams || {};
  const blueWon = !!(teams.blue && teams.blue.has_won);
  const redWon = !!(teams.red && teams.red.has_won);
  let winningTeam = null;
  if (blueWon && !redWon) winningTeam = 'Blue';
  else if (redWon && !blueWon) winningTeam = 'Red';
  else if (teams.blue && teams.red) {
    winningTeam = (teams.blue.rounds_won || 0) >= (teams.red.rounds_won || 0) ? 'Blue' : 'Red';
  }

  const positions = {};
  Object.keys(playersMeta).forEach(pid => { positions[pid] = { kills: [], deaths: [] }; });
  const roundAttackerMap = {};
  roundsArr.forEach((r, i) => { roundAttackerMap[i] = attackerForRound(i + 1, half1Attacker, r); });

  killsArr.forEach(k => {
    const killerPid = k.killer_puuid, victimPid = k.victim_puuid;
    let killerLoc = null;
    (k.player_locations_on_kill || []).forEach(loc => {
      if (loc.player_puuid === killerPid) killerLoc = loc.location;
    });
    const deathLoc = k.victim_death_location;
    const atkTeam = roundAttackerMap[k.round];
    if (killerLoc && positions[killerPid] && isEnemyKill(k)) {
      const killerTeam = playersMeta[killerPid] && playersMeta[killerPid].team;
      positions[killerPid].kills.push({
        x: killerLoc.x, y: killerLoc.y, round: k.round, t: k.kill_time_in_round,
        weapon: k.damage_weapon_name, victim: k.victim_display_name,
        enemyX: deathLoc ? deathLoc.x : null, enemyY: deathLoc ? deathLoc.y : null,
        side: killerTeam === atkTeam ? 'attack' : 'defense',
      });
    }
    if (deathLoc && positions[victimPid]) {
      const victimTeam = playersMeta[victimPid] && playersMeta[victimPid].team;
      positions[victimPid].deaths.push({
        x: deathLoc.x, y: deathLoc.y, round: k.round, t: k.kill_time_in_round,
        weapon: k.damage_weapon_name, killer: k.killer_display_name,
        enemyX: killerLoc ? killerLoc.x : null, enemyY: killerLoc ? killerLoc.y : null,
        side: victimTeam === atkTeam ? 'attack' : 'defense',
      });
    }
  });

  const players = Object.keys(playersMeta).map(pid => {
    const meta = playersMeta[pid];
    const entry = { ...meta };
    const raw = { rounds: 0, kills: 0, deaths: 0, assists: 0, score: 0, damage_made: 0, damage_received: 0,
                   headshots: 0, bodyshots: 0, legshots: 0, fk: 0, fd: 0 };
    ['attack', 'defense'].forEach(side => {
      const s = sideStats[pid][side];
      Object.keys(raw).forEach(k => { raw[k] += s[k]; });
      const totalShots = s.headshots + s.bodyshots + s.legshots;
      const hsPct = totalShots ? Math.round((100 * s.headshots / totalShots) * 10) / 10 : 0;
      const rounds = s.rounds || 1;
      entry[side] = {
        rounds: s.rounds, kills: s.kills, deaths: s.deaths, assists: s.assists,
        kd: s.deaths ? Math.round((s.kills / s.deaths) * 100) / 100 : s.kills,
        adr: Math.round((s.damage_made / rounds) * 10) / 10,
        damage_made: s.damage_made,
        damage_received: s.damage_received,
        acs: Math.round((s.score / rounds) * 10) / 10,
        hs_pct: hsPct,
        fk: s.fk, fd: s.fd,
      };
    });
    entry.raw = raw;
    entry.rawSide = { attack: { ...sideStats[pid].attack }, defense: { ...sideStats[pid].defense } };
    entry.won = meta.team === winningTeam;
    entry.positions = positions[pid];
    return entry;
  });

  const siteStats = {};
  const byTeamSite = {};
  roundsArr.forEach((r, i) => {
    const roundNum = i + 1;
    const atk = attackerForRound(roundNum, half1Attacker, r);
    const site = (r.plant_events && r.plant_events.plant_site) || 'None';
    const win = r.winning_team;
    const atkWin = win === atk ? 1 : 0;
    if (!siteStats[site]) siteStats[site] = { rounds: 0, atkWin: 0 };
    siteStats[site].rounds += 1;
    siteStats[site].atkWin += atkWin;
    const key = atk + '_' + site;
    if (!byTeamSite[key]) byTeamSite[key] = { rounds: 0, wins: 0 };
    byTeamSite[key].rounds += 1;
    byTeamSite[key].wins += atkWin;
  });

  const siteOverall = {};
  Object.entries(siteStats).forEach(([site, s]) => {
    siteOverall[site] = {
      rounds: s.rounds,
      attacker_wins: s.atkWin,
      attacker_win_rate: s.rounds ? Math.round((100 * s.atkWin / s.rounds) * 10) / 10 : 0,
    };
  });
  const siteByTeam = {};
  Object.entries(byTeamSite).forEach(([key, s]) => {
    siteByTeam[key] = { rounds: s.rounds, wins: s.wins, win_rate: s.rounds ? Math.round((100 * s.wins / s.rounds) * 10) / 10 : 0 };
  });

  const roundTypeBreakdown = computeRoundTypeBreakdown(roundsArr);
  const postPlant = computePostPlantData(roundsArr, playersMeta);

  return {
    map: (m.metadata && m.metadata.map) || '不明',
    mode: (m.metadata && m.metadata.mode) || '不明',
    modeId: (m.metadata && m.metadata.mode_id) || null,
    matchId: (m.metadata && m.metadata.matchid) || null,
    gameStart: (m.metadata && m.metadata.game_start_patched) || null,
    gameStartTs: normalizeTs(m.metadata && m.metadata.game_start),
    rounds_played: roundsPlayed,
    teams: { blue: teams.blue || { rounds_won: 0 }, red: teams.red || { rounds_won: 0 } },
    winningTeam,
    players,
    site_breakdown: { overall: siteOverall, by_team: siteByTeam },
    round_type_breakdown: roundTypeBreakdown,
    post_plant: postPlant,
  };
}

function combineTotal(p) {
  const a = p.attack, d = p.defense;
  const kills = a.kills + d.kills, deaths = a.deaths + d.deaths, assists = a.assists + d.assists;
  const rounds = a.rounds + d.rounds;
  const damage_made = a.damage_made + d.damage_made;
  const damage_received = a.damage_received + d.damage_received;
  return {
    rounds, kills, deaths, assists,
    kd: deaths ? Math.round((kills / deaths) * 100) / 100 : kills,
    adr: Math.round((damage_made / (rounds || 1)) * 10) / 10,
    damage_made, damage_received,
    acs: Math.round(((a.acs * a.rounds + d.acs * d.rounds) / (rounds || 1)) * 10) / 10,
    hs_pct: Math.round(((a.hs_pct * a.rounds + d.hs_pct * d.rounds) / (rounds || 1)) * 10) / 10,
    fk: a.fk + d.fk,
    fd: a.fd + d.fd,
  };
}

function getSideData(p, side) {
  if (side === 'total') return combineTotal(p);
  return p[side];
}

function sortPlayers(players, team, side, key, dir) {
  return players
    .filter(p => p.team === team)
    .map(p => ({ meta: p, s: getSideData(p, side) }))
    .sort((a, b) => (dir === 'desc' ? b.s[key] - a.s[key] : a.s[key] - b.s[key]));
}

// ---------- Aggregate (multi-match) computation ----------

function buildAggregate(matches) {
  const agg = {}; // puuid -> accumulator
  matches.forEach(match => {
    match.dashboard.players.forEach(p => {
      if (!agg[p.puuid]) {
        agg[p.puuid] = {
          puuid: p.puuid, name: p.name, tag: p.tag, characters: {},
          matches: 0, wins: 0,
          rounds: 0, kills: 0, deaths: 0, assists: 0, score: 0,
          damage_made: 0, damage_received: 0, headshots: 0, bodyshots: 0, legshots: 0,
          fk: 0, fd: 0,
        };
      }
      const a = agg[p.puuid];
      a.name = p.name; a.tag = p.tag; // keep most recent naming
      a.characters[p.character] = (a.characters[p.character] || 0) + 1;
      a.matches += 1;
      if (p.won) a.wins += 1;
      const r = p.raw;
      a.rounds += r.rounds; a.kills += r.kills; a.deaths += r.deaths; a.assists += r.assists;
      a.score += r.score; a.damage_made += r.damage_made; a.damage_received += r.damage_received;
      a.headshots += r.headshots; a.bodyshots += r.bodyshots; a.legshots += r.legshots;
      a.fk += r.fk; a.fd += r.fd;
    });
  });

  return Object.values(agg).map(a => {
    const totalShots = a.headshots + a.bodyshots + a.legshots;
    const mainChar = Object.entries(a.characters).sort((x, y) => y[1] - x[1])[0];
    return {
      puuid: a.puuid, name: a.name, tag: a.tag,
      mainCharacter: mainChar ? mainChar[0] : '-',
      matches: a.matches,
      win_rate: a.matches ? Math.round((100 * a.wins / a.matches) * 10) / 10 : 0,
      wins: a.wins,
      kills: a.kills, deaths: a.deaths, assists: a.assists,
      kd: a.deaths ? Math.round((a.kills / a.deaths) * 100) / 100 : a.kills,
      adr: Math.round((a.damage_made / (a.rounds || 1)) * 10) / 10,
      acs: Math.round((a.score / (a.rounds || 1)) * 10) / 10,
      hs_pct: totalShots ? Math.round((100 * a.headshots / totalShots) * 10) / 10 : 0,
      fk: a.fk, fd: a.fd,
      damage_made: a.damage_made, damage_received: a.damage_received,
    };
  });
}

function buildAggregateRoundTypes(matches) {
  const overall = {};
  ROUND_TYPE_ORDER.forEach(t => { overall[t] = { rounds: 0, wins: 0 }; });
  matches.forEach(match => {
    const rtb = match.dashboard.round_type_breakdown;
    if (!rtb) return;
    Object.entries(rtb.overall).forEach(([type, s]) => {
      if (!overall[type]) overall[type] = { rounds: 0, wins: 0 };
      overall[type].rounds += s.rounds;
      overall[type].wins += s.wins;
    });
  });
  const out = {};
  Object.entries(overall).forEach(([type, s]) => {
    out[type] = { rounds: s.rounds, wins: s.wins, win_rate: s.rounds ? Math.round((100 * s.wins / s.rounds) * 10) / 10 : 0 };
  });
  return out;
}

// ---------- Kill/Death position map (uses official valorant-api.com map transform) ----------

// projectToNorm: converts in-game x/y to normalized 0..1 minimap coordinates using
// Riot's own per-map transform (xMultiplier/yMultiplier/xScalarToAdd/yScalarToAdd),
// the same formula documented for their official minimap texture.
function projectToNorm(x, y, meta) {
  const normX = meta.xMultiplier * y + meta.xScalarToAdd;
  const normY = meta.yMultiplier * x + meta.yScalarToAdd;
  return [normX, normY];
}

function heatColor(t) {
  const stops = [
    [0.0, [40, 60, 220]],
    [0.35, [0, 220, 220]],
    [0.65, [255, 220, 0]],
    [1.0, [255, 40, 40]],
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0 || 1);
      return [
        Math.round(c0[0] + (c1[0] - c0[0]) * f),
        Math.round(c0[1] + (c1[1] - c0[1]) * f),
        Math.round(c0[2] + (c1[2] - c0[2]) * f),
      ];
    }
  }
  return stops[stops.length - 1][1];
}

function drawHeatmap(canvas, normPoints) {
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  if (!normPoints.length) return;

  ctx.globalCompositeOperation = 'lighter';
  const radius = Math.max(W, H) * 0.055;
  normPoints.forEach(([nx, ny]) => {
    const cx = nx * W, cy = ny * H;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, 'rgba(255,255,255,0.35)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';

  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = data[i + 3]; // accumulated alpha = density, since fill color is always pure white
    if (v < 4) { data[i + 3] = 0; continue; }
    const t = Math.min(1, v / 130);
    const [r, g, b] = heatColor(t);
    data[i] = r; data[i + 1] = g; data[i + 2] = b;
    data[i + 3] = Math.min(230, Math.round(40 + v * 1.5));
  }
  ctx.putImageData(imgData, 0, 0);
}

function HeatmapCanvas({ points }) {
  const canvasRef = useRef(null);
  React.useEffect(() => {
    if (canvasRef.current) drawHeatmap(canvasRef.current, points);
  }, [JSON.stringify(points)]);
  return (
    <canvas
      ref={canvasRef}
      width={400}
      height={400}
      style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }}
    />
  );
}

// ---------- ラウンド内の時間帯（30秒区切り）----------

const TIME_BIN_MS = 30000;

function fmtRoundTime(ms) {
  const sec = Math.floor(ms / 1000);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

// 30秒ごとのキル数・デス数の棒グラフ。棒（時間帯）をクリックすると絞り込みの切り替え
function TimeBinChart({ kills, deaths, nBins, selected, onToggle }) {
  const binOf = (t) => Math.min(nBins - 1, Math.floor(t / TIME_BIN_MS));
  const kc = new Array(nBins).fill(0), dc = new Array(nBins).fill(0);
  kills.forEach(e => { if (e.t != null) kc[binOf(e.t)] += 1; });
  deaths.forEach(e => { if (e.t != null) dc[binOf(e.t)] += 1; });

  const W = 360, H = 250, pad = { l: 30, r: 10, t: 18, b: 44 };
  const maxC = Math.max(1, ...kc, ...dc);
  const step = Math.max(1, Math.ceil(maxC / 4));
  const top = step * Math.ceil(maxC / step);
  const ticks = [];
  for (let v = 0; v <= top; v += step) ticks.push(v);
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const gw = plotW / nBins;
  const bw = Math.min(22, gw * 0.36);
  const y = (v) => pad.t + plotH * (1 - v / top);
  const base = pad.t + plotH;
  const anySel = selected.length > 0;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
      {ticks.map(v => (
        <g key={v}>
          <line x1={pad.l} x2={W - pad.r} y1={y(v)} y2={y(v)} stroke="#1E262E" strokeWidth="1" />
          <text x={pad.l - 6} y={y(v) + 4} textAnchor="end" fontSize="10" fill="#6B7885">{v}</text>
        </g>
      ))}
      {Array.from({ length: nBins }, (_, i) => {
        const gx = pad.l + gw * i, cx = gx + gw / 2;
        const sel = selected.includes(i);
        return (
          <g key={i} onClick={() => onToggle(i)} style={{ cursor: 'pointer' }} opacity={anySel && !sel ? 0.35 : 1}>
            <title>{`${i * 30}–${(i + 1) * 30}秒: キル ${kc[i]} / デス ${dc[i]}`}</title>
            <rect x={gx + 2} y={pad.t} width={gw - 4} height={plotH + 26} rx="3" fill={sel ? '#F5A62320' : 'transparent'} />
            {kc[i] > 0 && <rect x={cx - bw - 1} y={y(kc[i])} width={bw} height={base - y(kc[i])} fill="#4ADE80" rx="2" />}
            {dc[i] > 0 && <rect x={cx + 1} y={y(dc[i])} width={bw} height={base - y(dc[i])} fill="#FF6B6B" rx="2" />}
            {kc[i] > 0 && <text x={cx - bw / 2 - 1} y={y(kc[i]) - 4} textAnchor="middle" fontSize="10" fontWeight="700" fill="#4ADE80">{kc[i]}</text>}
            {dc[i] > 0 && <text x={cx + bw / 2 + 1} y={y(dc[i]) - 4} textAnchor="middle" fontSize="10" fontWeight="700" fill="#FF6B6B">{dc[i]}</text>}
            <text x={cx} y={base + 15} textAnchor="middle" fontSize="10" fill={sel ? '#F5A623' : '#8B9AA8'} fontWeight={sel ? 700 : 400}>{`${i * 30}–${(i + 1) * 30}`}</text>
          </g>
        );
      })}
      <line x1={pad.l} x2={W - pad.r} y1={base} y2={base} stroke="#2A333B" strokeWidth="1" />
      <text x={pad.l + plotW / 2} y={H - 6} textAnchor="middle" fontSize="10" fill="#5A6570">ラウンド開始からの経過時間（秒）</text>
    </svg>
  );
}

function PositionMapView({ dashboard, mapMetaCache, setMapMetaCache }) {
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [showKills, setShowKills] = useState(true);
  const [showDeaths, setShowDeaths] = useState(true);
  const [posSide, setPosSide] = useState('total'); // 'total' | 'attack' | 'defense'
  const [viewMode, setViewMode] = useState('points'); // 'points' | 'heatmap'
  const [hover, setHover] = useState(null);
  const [timeSel, setTimeSel] = useState([]); // 選択中の時間帯（30秒区切りのインデックス）。空 = すべて

  const mapName = dashboard.map;
  const cacheEntry = mapMetaCache[mapName];

  React.useEffect(() => {
    if (cacheEntry) return;
    setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'loading' } }));
    fetch('https://valorant-api.com/v1/maps')
      .then(res => res.json())
      .then(json => {
        const found = (json.data || []).find(m => m.displayName === mapName);
        if (!found || !found.displayIcon) {
          setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'error', message: 'マップ画像が見つかりませんでした' } }));
          return;
        }
        setMapMetaCache(prev => ({
          ...prev,
          [mapName]: {
            status: 'ready',
            displayIcon: found.displayIcon,
            xMultiplier: found.xMultiplier, yMultiplier: found.yMultiplier,
            xScalarToAdd: found.xScalarToAdd, yScalarToAdd: found.yScalarToAdd,
          },
        }));
      })
      .catch(err => {
        setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'error', message: String(err) } }));
      });
  }, [mapName]);

  const players = dashboard.players;
  const player = players[selectedIdx];
  const filterBySide = (arr) => posSide === 'total' ? arr : arr.filter(e => e.side === posSide);

  // 時間帯: 試合内の全キル/デスの最大経過時間から、30秒区切りの区間数を決める
  const allT = [];
  players.forEach(pl => pl.positions.kills.concat(pl.positions.deaths).forEach(e => { if (e.t != null) allT.push(e.t); }));
  const hasTime = allT.length > 0;
  const nBins = hasTime ? Math.min(8, Math.floor(Math.max(...allT) / TIME_BIN_MS) + 1) : 0;
  const binOf = (t) => Math.min(nBins - 1, Math.floor(t / TIME_BIN_MS));
  const activeBins = timeSel.filter(i => i < nBins);
  const timeOk = (e) => !hasTime || activeBins.length === 0 || (e.t != null && activeBins.includes(binOf(e.t)));
  const filterAll = (arr) => filterBySide(arr).filter(timeOk);
  const toggleBin = (i) => setTimeSel(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i].sort((a, b) => a - b));

  const filteredKills = player ? filterAll(player.positions.kills) : [];

  return (
    <div>
      <div style={{ display: 'flex', gap: '24px', alignItems: 'flex-start', flexWrap: 'wrap' }}>
        <div style={{ minWidth: '220px', flex: '0 0 220px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
            {players.map((p, idx) => {
              const isSel = idx === selectedIdx;
              const color = TEAM_COLOR[p.team];
              return (
                <div
                  key={idx}
                  onClick={() => setSelectedIdx(idx)}
                  style={{
                    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                    padding: '9px 12px', borderRadius: '4px', cursor: 'pointer',

                  }}
                >
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '2px', minWidth: 0 }}>

                    }}>{p.name}</span>
                    <span style={{ fontSize: '11px', color: '#6B7885' }}>{p.character}</span>
                  </div>
                  <div style={{ display: 'flex', gap: '6px', fontSize: '12px', fontWeight: 600, flexShrink: 0 }}>
                    <span style={{ color: '#4ADE80' }}>{filterAll(p.positions.kills).length}K</span>
                    <span style={{ color: '#FF6B6B' }}>{filterAll(p.positions.deaths).length}D</span>
                  </div>

        </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span style={{ width: '10px', height: '10px', borderRadius: '50%', background: TEAM_COLOR[player.team], display: 'inline-block' }} />
              <span style={{ fontSize: '16px', fontWeight: 700, color: '#F2F5F7' }}>{player.name}</span>
              <span style={{ fontSize: '13px', color: '#8B9AA8' }}>#{player.tag}</span>
            </div>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              {['total', 'attack', 'defense'].map(sd => (
                <div key={sd} onClick={() => setPosSide(sd)} style={{
                  padding: '6px 12px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
                  letterSpacing: '0.02em',
                  border: `1px solid ${posSide === sd ? SIDE_ACCENT[sd] : '#2A333B'}`,
                  color: posSide === sd ? SIDE_ACCENT[sd] : '#5A6570',
                  background: posSide === sd ? `${SIDE_ACCENT[sd]}14` : 'transparent'
                }}>{SIDE_LABEL[sd]}</div>
              ))}
              <div onClick={() => setShowKills(v => !v)} style={{
                padding: '6px 12px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
                letterSpacing: '0.04em', textTransform: 'uppercase',
                border: `1px solid ${showKills ? '#4ADE80' : '#2A333B'}`,
                color: showKills ? '#4ADE80' : '#5A6570',
                background: showKills ? '#4ADE8014' : 'transparent'
              }}>Kills ({filteredKills.length})</div>
              <div onClick={() => setShowDeaths(v => !v)} style={{
                padding: '6px 12px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
                letterSpacing: '0.04em', textTransform: 'uppercase',
                border: `1px solid ${showDeaths ? '#FF6B6B' : '#2A333B'}`,
                color: showDeaths ? '#FF6B6B' : '#5A6570',
                background: showDeaths ? '#FF6B6B14' : 'transparent'
              }}>Deaths ({filteredDeaths.length})</div>
            </div>

          <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
            {[['points', 'ポイント表示'], ['heatmap', 'ヒートマップ']].map(([k, label]) => (

                padding: '6px 12px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
                letterSpacing: '0.02em',
                border: `1px solid ${viewMode === k ? '#9B8CFF' : '#2A333B'}`,
                color: viewMode === k ? '#9B8CFF' : '#5A6570',
                background: viewMode === k ? '#9B8CFF14' : 'transparent'
              }}>{label}</div>
            ))}
          </div>

          {hasTime && (
            <div style={{ display: 'flex', gap: '6px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '10px' }}>
              <span style={{ fontSize: '11px', color: '#6B7885', fontWeight: 700, marginRight: '2px' }}>時間帯</span>
              {[['all', 'すべて', activeBins.length === 0, () => setTimeSel([])],
                ...Array.from({ length: nBins }, (_, i) => [i, `${i * 30}–${(i + 1) * 30}秒`, activeBins.includes(i), () => toggleBin(i)])
              ].map(([k, label, active, onClick]) => (
                <div key={k} onClick={onClick} style={{
                  padding: '6px 10px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
                  border: `1px solid ${active ? '#F5A623' : '#2A333B'}`,
                  color: active ? '#F5A623' : '#5A6570',
                  background: active ? '#F5A62314' : 'transparent', whiteSpace: 'nowrap'
                }}>{label}</div>
              ))}

          )}

          <div style={{
            position: 'relative', border: '1px solid #1E262E', borderRadius: '6px', overflow: 'hidden',
            background: '#0D1117', width: '100%', maxWidth: '600px', maxHeight: '70vh',
            aspectRatio: '1 / 1', margin: '0 auto'
          }}>
            <img src={cacheEntry.displayIcon} alt={mapName + ' minimap'} style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }} />

            {viewMode === 'heatmap' && (
              <HeatmapCanvas points={[
                ...(showKills ? filteredKills.map(k => projectToNorm(k.x, k.y, cacheEntry)) : []),
                ...(showDeaths ? filteredDeaths.map(d => projectToNorm(d.x, d.y, cacheEntry)) : []),
              ]} />
            )}

            {viewMode === 'points' && (
            <svg viewBox="0 0 1 1" style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }}>
              {showDeaths && filteredDeaths.map((d, i) => {
                const [nx, ny] = projectToNorm(d.x, d.y, cacheEntry);
                const hasEnemy = d.enemyX != null && d.enemyY != null;
                const [enx, eny] = hasEnemy ? projectToNorm(d.enemyX, d.enemyY, cacheEntry) : [null, null];
                const r = 0.007;
                return (
                  <g key={'d' + i}>
                    {hasEnemy && <line x1={nx} y1={ny} x2={enx} y2={eny} stroke="#FF3B3B" strokeOpacity="0.4" strokeWidth="0.0015" strokeDasharray="0.006,0.005" />}
                    {hasEnemy && (
                      <circle cx={enx} cy={eny} r="0.0055" fill="none" stroke="#8B9AA8" strokeWidth="0.0016"
                        onMouseEnter={() => setHover({ type: 'death', data: d })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }} />
                    )}
                    <g onMouseEnter={() => setHover({ type: 'death', data: d })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }}>
                      <line x1={nx - r} y1={ny - r} x2={nx + r} y2={ny + r} stroke="#FF3B3B" strokeWidth={r * 0.4} strokeLinecap="round" />
                      <line x1={nx - r} y1={ny + r} x2={nx + r} y2={ny - r} stroke="#FF3B3B" strokeWidth={r * 0.4} strokeLinecap="round" />
                    </g>
                  </g>
                );
              })}
              {showKills && filteredKills.map((k, i) => {
                const [nx, ny] = projectToNorm(k.x, k.y, cacheEntry);
                const hasEnemy = k.enemyX != null && k.enemyY != null;
                const [enx, eny] = hasEnemy ? projectToNorm(k.enemyX, k.enemyY, cacheEntry) : [null, null];
                return (
                  <g key={'k' + i}>
                    {hasEnemy && <line x1={nx} y1={ny} x2={enx} y2={eny} stroke="#4ADE80" strokeOpacity="0.4" strokeWidth="0.0015" strokeDasharray="0.006,0.005" />}
                    {hasEnemy && (
                      <circle cx={enx} cy={eny} r="0.0055" fill="none" stroke="#8B9AA8" strokeWidth="0.0016"

                    )}

                      onMouseEnter={() => setHover({ type: 'kill', data: k })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }} />
                  </g>
                );
              })}
            </svg>
            )}

            {viewMode === 'points' && hover && (
              <div style={{
                position: 'absolute', top: '10px', left: '10px',
                background: '#0D1116EE', border: `1px solid ${hover.type === 'kill' ? '#4ADE80' : '#FF6B6B'}`,
                borderRadius: '4px', padding: '8px 12px', fontSize: '12px', lineHeight: 1.6, pointerEvents: 'none', maxWidth: '260px'
              }}>
                <div style={{ fontWeight: 700, color: hover.type === 'kill' ? '#4ADE80' : '#FF6B6B', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                  {hover.type === 'kill' ? 'Kill' : 'Death'} — Round {hover.data.round + 1}{hover.data.t != null ? ` · ${fmtRoundTime(hover.data.t)}` : ''}
                </div>
                <div style={{ color: '#C7D0D8' }}>
                  {hover.type === 'kill'
                    ? `${player.name} → ${hover.data.victim} (${hover.data.weapon || '不明'})`
                    : `${hover.data.killer} → ${player.name} (${hover.data.weapon || '不明'})`}
                </div>
              </div>
            )}
          </div>

          <div style={{ display: 'flex', gap: '20px', marginTop: '10px', fontSize: '12px', color: '#8B9AA8', flexWrap: 'wrap' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '10px', height: '10px', borderRadius: '50%', background: '#4ADE80', display: 'inline-block' }} />
              キル位置
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ color: '#FF3B3B', fontWeight: 900 }}>×</span>
              デス位置
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '10px', height: '10px', borderRadius: '50%', border: '1.5px solid #8B9AA8', display: 'inline-block' }} />

            </div>
          </div>
          <p style={{ fontSize: '11px', color: '#4A545E', marginTop: '8px' }}>
            背景はRiot公式ミニマップ（valorant-api.com）で、座標変換も公式の係数を使用しています
          </p>
        </div>

        {hasTime && player && (
          <div style={{ flex: '1 1 300px', minWidth: '280px', maxWidth: '400px' }}>
            <div style={{ fontSize: '13px', fontWeight: 700, color: '#C7D0D8', marginBottom: '2px' }}>
              時間帯別 キル / デス（30秒ごと）
            </div>
            <div style={{ fontSize: '11px', color: '#6B7885', marginBottom: '10px' }}>
              {player.name} · {SIDE_LABEL[posSide]} · 棒をクリックで時間帯を絞り込み
            </div>
            <div style={{ border: '1px solid #1E262E', borderRadius: '6px', padding: '10px 12px' }}>
              <TimeBinChart
                kills={filterBySide(player.positions.kills)}
                deaths={filterBySide(player.positions.deaths)}
                nBins={nBins} selected={activeBins} onToggle={toggleBin}
              />
              <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', fontSize: '12px', color: '#8B9AA8', marginTop: '4px' }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span style={{ width: '10px', height: '10px', background: '#4ADE80', display: 'inline-block', borderRadius: '2px' }} />キル
                </span>
                <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span style={{ width: '10px', height: '10px', background: '#FF6B6B', display: 'inline-block', borderRadius: '2px' }} />デス
                </span>
              </div>
            </div>
            <p style={{ fontSize: '11px', color: '#4A545E', marginTop: '8px', lineHeight: 1.6 }}>
              ラウンド開始からの経過時間で集計しています。グラフは時間帯の絞り込みに関係なく、全時間帯を表示します（選択中の時間帯は色付き）
            </p>
          </div>
        )}

      </div>
    </div>
  );
}

// ---------- プラント後: 人数状況の表示と統計 ----------

function countDiffColor(diff) { return diff > 0 ? '#4ADE80' : diff < 0 ? '#FF6B6B' : '#C7D0D8'; }
function countDiffLabel(diff) { return diff > 0 ? `人数有利 +${diff}` : diff < 0 ? `人数不利 ${diff}` : '互角'; }

// 生存人数を丸で表示（塗りつぶし = 生存、枠のみ = 死亡）
function AlivePips({ alive, color, total = 5 }) {
  return (
    <span style={{ display: 'inline-flex', gap: '4px', verticalAlign: 'middle' }}>
      {Array.from({ length: total }, (_, i) => (
        <span key={i} style={{
          width: '12px', height: '12px', borderRadius: '50%', display: 'inline-block', boxSizing: 'border-box',
          background: i < alive ? color : 'transparent', border: `2px solid ${i < alive ? color : '#2A333B'}`,
        }} />
      ))}
    </span>
  );
}

// 人数状況の統計（攻撃側の勝率）。表示中のラウンドと同じ人数状況の行を強調する
function PostPlantCountPanel({ pc, current }) {
  if (!pc || !pc.rounds) return null;
  const curKey = current ? `${current.atkAlive}v${current.defAlive}` : null;
  const card = { border: '1px solid #1E262E', borderRadius: '6px', padding: '16px 18px' };
  const cap = { fontSize: '12px', fontWeight: 700, color: '#8B9AA8', textTransform: 'uppercase', marginBottom: '12px' };
  const th = { padding: '4px 8px', color: '#6B7885', fontSize: '11px', fontWeight: 700, whiteSpace: 'nowrap' };
  const rateColor = (r) => r > 50 ? '#4ADE80' : r < 50 ? '#FF6B6B' : '#C7D0D8';
  const groups = [['adv', '人数有利（攻撃が多い）', '#4ADE80'], ['even', '互角', '#5CC8FF'], ['dis', '人数不利（攻撃が少ない）', '#FF6B6B']];
  const cell = (g) => g && g.rounds
    ? <span><span style={{ color: rateColor(g.win_rate), fontWeight: 700 }}>{g.win_rate}%</span> <span style={{ color: '#5A6570', fontSize: '11px' }}>({g.wins}/{g.rounds})</span></span>
    : <span style={{ color: '#3A444E' }}>{'\u2014'}</span>;

  return (
    <div style={{ flex: '1 1 340px', minWidth: '300px', maxWidth: '460px', display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <div style={card}>
        <div style={cap}>人数差別 攻撃側勝率（{pc.rounds}ラウンド）</div>
        {groups.map(([k, label, accent]) => (
          <SiteBar key={k} label={`${label} ${pc.byDiff[k].wins}/${pc.byDiff[k].rounds}`} rounds={pc.byDiff[k].rounds} rate={pc.byDiff[k].win_rate} accent={accent} />
        ))}
        <div style={{ fontSize: '12px', color: '#8B9AA8', marginTop: '4px' }}>
          設置時の平均生存人数：攻撃 <b style={{ color: '#EDEFF2' }}>{pc.avgAtk}</b> / 防衛 <b style={{ color: '#EDEFF2' }}>{pc.avgDef}</b>
        </div>
      </div>

      <div style={card}>
        <div style={cap}>人数状況別（攻撃 v 防衛）</div>
        <div style={{ maxHeight: '300px', overflowY: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid #1E262E' }}>
                <th style={{ ...th, textAlign: 'left' }}>状況</th>
                <th style={{ ...th, textAlign: 'center' }}>R</th>
                <th style={{ ...th, textAlign: 'center' }}>攻撃勝</th>
                <th style={{ ...th, textAlign: 'right' }}>勝率</th>
              </tr>
            </thead>
            <tbody>
              {pc.byState.map(st => {
                const isCur = `${st.atk}v${st.def}` === curKey;
                return (
                  <tr key={`${st.atk}v${st.def}`} style={{ borderBottom: '1px solid #161B21', background: isCur ? '#9B8CFF14' : 'transparent' }}>
                    <td style={{ padding: '6px 8px', fontWeight: 700, color: countDiffColor(st.diff), whiteSpace: 'nowrap' }}>
                      {st.atk} v {st.def}
                      {isCur && <span style={{ marginLeft: '6px', fontSize: '10px', color: '#9B8CFF' }}>表示中</span>}
                    </td>
                    <td style={{ padding: '6px 8px', textAlign: 'center', color: '#C7D0D8' }}>{st.rounds}</td>
                    <td style={{ padding: '6px 8px', textAlign: 'center', color: '#C7D0D8' }}>{st.wins}</td>
                    <td style={{ padding: '6px 8px', textAlign: 'right', fontWeight: 700, color: rateColor(st.win_rate) }}>{st.win_rate}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div style={card}>
        <div style={cap}>攻撃時のチーム別</div>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid #1E262E' }}>
                <th style={{ ...th, textAlign: 'left' }}>チーム</th>
                <th style={{ ...th, textAlign: 'center' }}>R</th>
                <th style={{ ...th, textAlign: 'center' }}>平均人数</th>
                <th style={{ ...th, textAlign: 'center' }}>有利</th>
                <th style={{ ...th, textAlign: 'center' }}>互角</th>
                <th style={{ ...th, textAlign: 'center' }}>不利</th>
              </tr>
            </thead>
            <tbody>
              {['Red', 'Blue'].map(team => {
                const t = pc.byTeam[team];
                return (
                  <tr key={team} style={{ borderBottom: '1px solid #161B21' }}>
                    <td style={{ padding: '8px', fontWeight: 700, color: TEAM_COLOR[team] }}>{team}</td>
                    {t ? (
                      <React.Fragment>
                        <td style={{ padding: '8px', textAlign: 'center', color: '#C7D0D8' }}>{t.rounds}</td>
                        <td style={{ padding: '8px', textAlign: 'center', color: '#C7D0D8', whiteSpace: 'nowrap' }}>{t.avgAtk} v {t.avgDef}</td>
                        <td style={{ padding: '8px', textAlign: 'center', whiteSpace: 'nowrap' }}>{cell(t.adv)}</td>
                        <td style={{ padding: '8px', textAlign: 'center', whiteSpace: 'nowrap' }}>{cell(t.even)}</td>
                        <td style={{ padding: '8px', textAlign: 'center', whiteSpace: 'nowrap' }}>{cell(t.dis)}</td>
                      </React.Fragment>
                    ) : <td colSpan={5} style={{ padding: '8px', color: '#3A444E', textAlign: 'center' }}>{'\u2014'}</td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <p style={{ fontSize: '11px', color: '#5A6570', margin: 0, lineHeight: 1.6 }}>
        人数 = スパイク設置時点で生存していた人数（攻撃側は設置者を含む）。勝率はすべて攻撃側の勝率です。「攻撃時のチーム別」は、そのチームが攻撃側だったラウンドのみを集計しています
      </p>
    </div>
  );
}

function PostPlantMapView({ dashboard, mapMetaCache, setMapMetaCache }) {
  const rounds = dashboard.post_plant.perRound
    .map((r, idx) => (r ? { ...r, roundIdx: idx } : null))
    .filter(Boolean);
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [hover, setHover] = useState(null);

  const mapName = dashboard.map;
  const cacheEntry = mapMetaCache[mapName];

  React.useEffect(() => {
    if (cacheEntry) return;
    setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'loading' } }));
    fetch('https://valorant-api.com/v1/maps')
      .then(res => res.json())
      .then(json => {
        const found = (json.data || []).find(m => m.displayName === mapName);
        if (!found || !found.displayIcon) {
          setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'error', message: 'マップ画像が見つかりませんでした' } }));
          return;
        }
        setMapMetaCache(prev => ({
          ...prev,
          [mapName]: {
            status: 'ready', displayIcon: found.displayIcon,
            xMultiplier: found.xMultiplier, yMultiplier: found.yMultiplier,
            xScalarToAdd: found.xScalarToAdd, yScalarToAdd: found.yScalarToAdd,
          },
        }));
      })
      .catch(err => setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'error', message: String(err) } })));
  }, [mapName]);

  if (!rounds.length) {
    return <div style={{ padding: '20px', color: '#6B7885', fontSize: '13px' }}>この試合ではプラント位置データが取得できませんでした。</div>;
  }
  if (!cacheEntry || cacheEntry.status === 'loading') {
    return <div style={{ padding: '40px', textAlign: 'center', color: '#6B7885', fontSize: '13px' }}>マップデータを読み込み中（valorant-api.com）...</div>;
  }
  if (cacheEntry.status === 'error') {
    return <div style={{ padding: '20px', color: '#FF9B9B', fontSize: '13px' }}>マップデータの取得に失敗しました: {cacheEntry.message}</div>;
  }

  const current = rounds[Math.min(selectedIdx, rounds.length - 1)];
  const [pnx, pny] = projectToNorm(current.plantLocation.x, current.plantLocation.y, cacheEntry);
  const scaleFactor = Math.abs(cacheEntry.xMultiplier);
  const rClose = DIST_BAND_THRESHOLDS.close * scaleFactor;
  const rMid = DIST_BAND_THRESHOLDS.mid * scaleFactor;

  const BAND_COLOR = { Close: '#FF6B6B', Mid: '#F5A623', Far: '#5CC8FF' };

  return (
    <div>
      <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', flexWrap: 'wrap' }}>
        {rounds.map((r, idx) => {
          const isSel = idx === selectedIdx;
          return (
            <div key={idx} onClick={() => setSelectedIdx(idx)} style={{
              padding: '6px 12px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
              border: `1px solid ${isSel ? '#9B8CFF' : '#2A333B'}`,
              color: isSel ? '#9B8CFF' : '#8B9AA8',
              background: isSel ? '#9B8CFF14' : 'transparent'
            }}>
              R{r.roundIdx + 1} <span style={{ color: TEAM_COLOR[r.attackTeam], fontWeight: 700 }}>{r.site}</span>
              <span style={{ marginLeft: '6px', color: countDiffColor(r.atkAlive - r.defAlive), fontWeight: 700 }}>{r.atkAlive}v{r.defAlive}</span>
            </div>
          );
        })}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px', fontSize: '13px', color: '#8B9AA8' }}>
        <span style={{ fontWeight: 700, color: '#F2F5F7' }}>Round {current.roundIdx + 1}</span>
        <span>{current.site}サイト設置</span>
        <span style={{ color: TEAM_COLOR[current.attackTeam] }}>攻撃: {current.attackTeam}</span>
        <span style={{ color: current.winningTeam === current.attackTeam ? '#4ADE80' : '#FF6B6B', fontWeight: 700 }}>
          {current.winningTeam === current.attackTeam ? '攻撃側の勝ち' : '防衛側の勝ち'}
        </span>
      </div>

      {(() => {
        const defTeam = current.attackTeam === 'Red' ? 'Blue' : 'Red';

// ---------- CSV 保存/復元（試合データを入れ子の配列ごとに複数のCSVへ分割）----------
const CSV_KEYS = ['match_id', '_idx', '_parent'];
const csvRawMatch = (mj) => (mj && Array.isArray(mj.data) ? mj.data[0] : (mj && mj.data) || mj);
const csvMatchId = (mj) => { const m = csvRawMatch(mj); return m && m.metadata ? (m.metadata.matchid || m.metadata.match_id) : null; };
// 値 -> セル文字列（空欄 = 項目なし / null は「null」）。数値や true に見える文字列は JSON 形式で引用して区別する
function csvEnc(v) {
  if (v === null) return 'null';
  if (typeof v === 'string') return (v === '' || /^(-?\d+(\.\d+)?([eE][+-]?\d+)?|true|false|null|[\[{"])/.test(v)) ? JSON.stringify(v) : v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  return JSON.stringify(v);
}
function csvDec(c) {
  if (c === '') return undefined;
  if (c === 'null') return null;
  if (c === 'true') return true;
  if (c === 'false') return false;
  if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(c)) return Number(c);
  if (/^[\[{"]/.test(c)) { try { return JSON.parse(c); } catch (e) { return c; } }
  return c;
}
const csvEsc = (c) => /[",\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;

function csvBuildFiles(rawList) {
  const tables = {};
  rawList.forEach((mj, n) => {
    const mid = csvMatchId(mj) || ('match' + n);
    const walk = (obj, tname, idx, parent) => {
      const row = { match_id: mid, _idx: idx, _parent: parent };
      const pid = parent === '' ? String(idx) : parent + '/' + idx;
      const visit = (o, prefix) => Object.keys(o).forEach(k => {
        const v = o[k], key = prefix + k;
        if (Array.isArray(v) && v.length && v.every(x => x && typeof x === 'object' && !Array.isArray(x))) {
          v.forEach((c, i) => walk(c, tname + '__' + key.replace(/\./g, '--'), i, pid));
        } else if (v && typeof v === 'object' && !Array.isArray(v)) visit(v, key + '.');
        else row[key] = v;
      });
      visit(obj, '');
      (tables[tname] = tables[tname] || []).push(row);
    };
    walk(csvRawMatch(mj), 'match', 0, '');
  });
  return Object.keys(tables).map(tname => {
    const rows = tables[tname];
    const cols = [...CSV_KEYS], seen = new Set(cols);
    rows.forEach(r => Object.keys(r).forEach(k => { if (!seen.has(k)) { seen.add(k); cols.push(k); } }));
    const lines = [cols.map(csvEsc).join(',')];
    rows.forEach(r => lines.push(cols.map(c => r[c] === undefined ? '' : csvEsc(CSV_KEYS.includes(c) ? String(r[c]) : csvEnc(r[c]))).join(',')));
    return { name: `valorant_${tname}.csv`, text: '\ufeff' + lines.join('\r\n') + '\r\n' };
  });
}

function csvParse(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// files: [[ファイル名, テキスト], ...] -> 試合JSONの配列（match_id ごとに復元）
function csvRebuildMatches(files) {
  const tables = {};
  files.forEach(([fname, text]) => {
    const mt = /^valorant_(.+?)(?: \(\d+\))?\.csv$/i.exec(fname.split(/[\\/]/).pop());
    if (!mt) return;
    const rows = csvParse(text);
    if (rows.length < 2) return;
    const cols = rows[0], list = (tables[mt[1]] = tables[mt[1]] || []);
    rows.slice(1).forEach(cells => {
      const r = {};
      cols.forEach((c, i) => {
        const raw = cells[i] === undefined ? '' : cells[i];
        if (c === 'match_id' || c === '_parent') r[c] = raw;
        else if (c === '_idx') r[c] = Number(raw);
        else { const v = csvDec(raw); if (v !== undefined) r[c] = v; }
      });
      list.push(r);
    });
  });
  if (!tables.match) throw new Error('valorant_match.csv が見つかりません（保存したCSVをまとめて選択してください）');
  const rowKey = (r) => r.match_id + '|' + (r._parent === '' ? String(r._idx) : r._parent + '/' + r._idx);
  const objs = {}, names = Object.keys(tables);
  names.forEach(t => {
    objs[t] = {};
    tables[t].sort((a, b) => a._idx - b._idx).forEach(r => {
      const o = {};
      Object.keys(r).forEach(k => {
        if (CSV_KEYS.includes(k)) return;
        const ks = k.split('.'); let c = o;
        ks.slice(0, -1).forEach(x => { if (c[x] === null || typeof c[x] !== 'object') c[x] = {}; c = c[x]; });
        c[ks[ks.length - 1]] = r[k];
      });
      objs[t][rowKey(r)] = o;
    });
  });
  names.filter(t => t !== 'match').forEach(t => {
    const segs = t.split('__'), parentName = segs.slice(0, -1).join('__');
    const ks = segs[segs.length - 1].replace(/--/g, '.').split('.'), last = ks[ks.length - 1];
    tables[t].forEach(r => {
      const par = objs[parentName] && objs[parentName][r.match_id + '|' + r._parent];
      if (!par) return;
      let c = par;
      ks.slice(0, -1).forEach(x => { if (c[x] === null || typeof c[x] !== 'object') c[x] = {}; c = c[x]; });
      (c[last] = Array.isArray(c[last]) ? c[last] : []).push(objs[t][rowKey(r)]);
    });
  });
  return tables.match.map(r => ({ status: 200, data: [objs.match[r.match_id + '|0']] }));
}

// ---------- GitHub リポジトリの試合データ(JSON)を自動読み込み ----------
// dirs: 読み込むフォルダ（''=リポジトリ直下）。新しいJSONをpushするだけで、次回表示時に自動で反映されます
const AUTO_LOAD = {
  enabled: true,
  owner: 'eureka-vl', repo: 'valorant-stats', branch: 'main',
  dirs: ['', 'data'],
  ignore: ['package.json', 'package-lock.json', 'tsconfig.json', 'manifest.json', 'vercel.json'],
};

async function githubFetchJsonFiles(cfg, force) {
  // GitHub APIは認証なしだと1時間60回までなので、ファイル一覧は10分間キャッシュし、上限に当たったときは古いキャッシュで続行する
  const key = `gh-list:${cfg.owner}/${cfg.repo}@${cfg.branch}`;
  let cached = null;
  try { cached = JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (e) {}
  let list = cached && !force && Date.now() - cached.t < 10 * 60 * 1000 ? cached.list : null;
  if (!list) {
    try {
      list = [];
      for (const dir of cfg.dirs) {
        const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${dir}?ref=${cfg.branch}`);
        if (r.status === 404) continue; // フォルダが無ければ読み飛ばす
        if (!r.ok) throw new Error(r.status === 403 ? 'GitHub APIの利用上限に達しました。しばらく待ってから再試行してください' : `GitHub APIエラー (${r.status})`);
        (await r.json()).forEach(f => {
          if (f.type === 'file' && /\.json$/i.test(f.name) && !cfg.ignore.includes(f.name.toLowerCase())) list.push({ name: f.name, download_url: f.download_url });
        });
      }
      try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), list })); } catch (e) {}
    } catch (e) {
      if (cached && cached.list) list = cached.list; else throw e;
    }
  }
  return Promise.all(list.map(async f => {
    const r = await fetch(f.download_url);
    if (!r.ok) throw new Error(`${f.name} の取得に失敗しました (${r.status})`);
    return { name: f.name, text: await r.text() };
  }));
}

// ---------- Player profile (per PUUID, across matches) ----------

const r1 = (v) => Math.round(v * 10) / 10;
const r2 = (v) => Math.round(v * 100) / 100;
const ACC_KEYS = ['rounds', 'kills', 'deaths', 'assists', 'score', 'damage_made', 'damage_received', 'headshots', 'bodyshots', 'legshots', 'fk', 'fd'];

function emptyAcc() {
  const a = { matches: 0, wins: 0 };
  ACC_KEYS.forEach(k => { a[k] = 0; });
  return a;
}
function addRaw(acc, r) { ACC_KEYS.forEach(k => { acc[k] += (r && r[k]) || 0; }); }
function finalizeAcc(a) {
  const shots = a.headshots + a.bodyshots + a.legshots;
  return {
    matches: a.matches, wins: a.wins, losses: a.matches - a.wins,
    win_rate: a.matches ? r1(100 * a.wins / a.matches) : 0,
    rounds: a.rounds, kills: a.kills, deaths: a.deaths, assists: a.assists,
    kd: a.deaths ? r2(a.kills / a.deaths) : a.kills,
    acs: a.rounds ? r1(a.score / a.rounds) : 0,
    adr: a.rounds ? r1(a.damage_made / a.rounds) : 0,
    dpr_received: a.rounds ? r1(a.damage_received / a.rounds) : 0,
    hs_pct: shots ? r1(100 * a.headshots / shots) : 0,
    fk: a.fk, fd: a.fd,
  };
}

function formatDate(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const p2 = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p2(d.getMonth() + 1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

function listPlayers(matches) {
  const map = {};
  matches.forEach(m => {
    m.dashboard.players.forEach(p => {
      if (!map[p.puuid]) map[p.puuid] = { puuid: p.puuid, name: p.name, tag: p.tag, matches: 0 };
      map[p.puuid].name = p.name;
      map[p.puuid].tag = p.tag;
      map[p.puuid].matches += 1;
    });
  });
  return Object.values(map).sort((a, b) => b.matches - a.matches || String(a.name).localeCompare(String(b.name)));
}

function buildPlayerProfile(puuid, matches) {
  const sorted = matches.slice().sort((a, b) => (a.dashboard.gameStartTs || 0) - (b.dashboard.gameStartTs || 0));
  const total = emptyAcc();
  const side = { attack: emptyAcc(), defense: emptyAcc() };
  const byAgent = {}, byMap = {}, names = {};
  const posByMap = {}; // mapName -> { kills: [], deaths: [] }（全試合分）
  const history = [];
  let name = null, tag = null, rank = null;

  sorted.forEach(match => {
    const d = match.dashboard;
    const p = d.players.find(x => x.puuid === puuid);
    if (!p) return;
    name = p.name; tag = p.tag; if (p.rank) rank = p.rank;
    names[`${p.name}#${p.tag}`] = true;
    const won = !!p.won;

    total.matches += 1; if (won) total.wins += 1; addRaw(total, p.raw);
    ['attack', 'defense'].forEach(sd => { if (p.rawSide && p.rawSide[sd]) addRaw(side[sd], p.rawSide[sd]); });

    const agent = p.character || '不明';
    if (!byAgent[agent]) byAgent[agent] = emptyAcc();
    byAgent[agent].matches += 1; if (won) byAgent[agent].wins += 1; addRaw(byAgent[agent], p.raw);
    const mp = d.map || '不明';
    if (!byMap[mp]) byMap[mp] = emptyAcc();
    byMap[mp].matches += 1; if (won) byMap[mp].wins += 1; addRaw(byMap[mp], p.raw);
    if (!posByMap[mp]) posByMap[mp] = { kills: [], deaths: [] };
    const tagPos = (e) => ({ ...e, matchId: match.id, ts: d.gameStartTs, agent });
    ((p.positions && p.positions.kills) || []).forEach(e => posByMap[mp].kills.push(tagPos(e)));
    ((p.positions && p.positions.deaths) || []).forEach(e => posByMap[mp].deaths.push(tagPos(e)));

    const own = d.teams[String(p.team).toLowerCase()] || {};
    const opp = d.teams[p.team === 'Blue' ? 'red' : 'blue'] || {};
    const raw = p.raw;
    const shots = raw.headshots + raw.bodyshots + raw.legshots;
    history.push({
      id: match.id, ts: d.gameStartTs, map: d.map, modeLabel: modeLabelOf(match), agent, team: p.team, won,
      roundsFor: own.rounds_won || 0, roundsAgainst: opp.rounds_won || 0,
      kills: raw.kills, deaths: raw.deaths, assists: raw.assists,
      kd: raw.deaths ? r2(raw.kills / raw.deaths) : raw.kills,
      acs: raw.rounds ? r1(raw.score / raw.rounds) : 0,
      adr: raw.rounds ? r1(raw.damage_made / raw.rounds) : 0,
      hs_pct: shots ? r1(100 * raw.headshots / shots) : 0,
      fk: raw.fk, fd: raw.fd,
    });
  });

  if (!history.length) return null;
  const fin = (obj) => Object.entries(obj)
    .map(([label, acc]) => ({ label, ...finalizeAcc(acc) }))
    .sort((a, b) => b.matches - a.matches || b.acs - a.acs);
  return {
    name, tag, rank, aliases: Object.keys(names),
    total: finalizeAcc(total),
    side: { attack: finalizeAcc(side.attack), defense: finalizeAcc(side.defense) },
    agents: fin(byAgent), maps: fin(byMap), history, positionsByMap: posByMap,
    bestAcs: history.reduce((b, h) => (h.acs > b.acs ? h : b), history[0]),
    mostKills: history.reduce((b, h) => (h.kills > b.kills ? h : b), history[0]),
  };
}

function PlayerLink({ p, onOpen }) {
  return (
    <React.Fragment>
      <span onClick={() => onOpen(p.puuid)} title="個人ページを開く"
        style={{ cursor: 'pointer', borderBottom: '1px dotted #5A6570' }}>{p.name}</span>

    </React.Fragment>

}

function TrendChart({ history }) {
  const values = history.map(h => h.acs);
  const n = values.length;
  if (n < 2) {
    return <p style={{ fontSize: '12px', color: '#6B7885', margin: 0 }}>推移グラフは2試合以上で表示されます。</p>;
  }
  const W = 480, H = 140, pad = { l: 36, r: 12, t: 12, b: 22 };
  const maxV = Math.max(...values, 1) * 1.1;
  const x = (i) => pad.l + ((W - pad.l - pad.r) * i) / (n - 1);
  const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / maxV);
  const avg = values.reduce((a, b) => a + b, 0) / n;
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const ticks = [0, maxV / 2, maxV];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: `${W}px`, height: 'auto', display: 'block' }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={pad.l} x2={W - pad.r} y1={y(t)} y2={y(t)} stroke="#1E262E" strokeWidth="1" />
          <text x={pad.l - 6} y={y(t) + 4} textAnchor="end" fontSize="10" fill="#6B7885">{Math.round(t)}</text>
        </g>
      ))}
      <line x1={pad.l} x2={W - pad.r} y1={y(avg)} y2={y(avg)} stroke="#9B8CFF" strokeOpacity="0.6" strokeDasharray="5,4" />
      <text x={W - pad.r} y={y(avg) - 4} textAnchor="end" fontSize="10" fill="#9B8CFF">平均 {r1(avg)}</text>
      <polyline points={pts} fill="none" stroke="#5CC8FF" strokeWidth="2" />
      {history.map((h, i) => (
        <g key={i}>
          <circle cx={x(i)} cy={y(h.acs)} r="4" fill={h.won ? '#4ADE80' : '#FF6B6B'} stroke="#0a0d12" strokeWidth="1.5">
            <title>{`${formatDate(h.ts)} ${h.map} ${h.agent}\nACS ${h.acs} / ${h.kills}-${h.deaths}-${h.assists} / ${h.won ? '勝ち' : '負け'}`}</title>
          </circle>
          <text x={x(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="#5A6570">{i + 1}</text>
        </g>
      ))}
    </svg>
  );
}
