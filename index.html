// ---------- 個人ページ用: 自動アドバイス（ルールベース） ----------

// kind: 'warn' = 改善ポイント / 'good' = 強み / 'info' = 傾向。score は重要度（差の大きさ）で、並び順に使う
function buildAdvice(profile, me, avg, hasPeers) {
  const items = [];
  const add = (kind, title, text, score) => items.push({ kind, title, text, score });
  const t = profile.total;
  const f = (v) => r1(v);

  // --- 全体平均との比較（比較対象のプレイヤーが2人以上いるときのみ）---
  if (me && avg && hasPeers) {
    const hsR = avg.hs ? me.hs / avg.hs : 1;
    if (hsR < 0.9) add('warn', 'HS%が全体平均より低め',
      `HS% は ${f(me.hs)}%（全体平均 ${f(avg.hs)}%）です。クロスエアの位置を常に相手の頭の高さに置くこと、ピークする際にプリエイムを徹底すること、初弾の精度、しゃがみスプレーに依存しないことを意識してみてください。デスマッチや1人でカスタムに入り、マップ別で頭の高さを維持する練習をするのも効果的です。`, Math.min(1, (1 - hsR) * 2));
    else if (hsR > 1.1) add('good', 'ヘッドショット精度が高い',
      `HS% は ${f(me.hs)}%（全体平均 ${f(avg.hs)}%）と平均を上回っています。エイムの精度が武器になっているので、自信をもってドライのファイトを積極的に仕掛けることも良い選択肢になります。`, Math.min(1, (hsR - 1) * 2));

    const acsR = avg.acs ? me.acs / avg.acs : 1;
    if (acsR < 0.92) add('warn', 'ACSが全体平均より低め',
      `ACS は ${f(me.acs)}（全体平均 ${f(avg.acs)}）です。キル・ダメージ・アシストの総合貢献が平均を下回っています。ロールによっては低くなりがちな数値ですが、味方と近い距離を保ってトレードに参加することで底上げしやすくなります。`, Math.min(1, (1 - acsR) * 2));
    else if (acsR > 1.08) add('good', 'チームの火力の中心になれている',
      `ACS は ${f(me.acs)}（全体平均 ${f(avg.acs)}）と平均を上回っています。ラウンドへの貢献度が高く、安定して戦果を出せています。`, Math.min(1, (acsR - 1) * 2));

    const kdR = avg.kd ? me.kd / avg.kd : 1;
    if (kdR < 0.92) add('warn', 'デスが多め（K/Dが平均以下）',
      `K/D は ${me.kd.toFixed(2)}（全体平均 ${avg.kd.toFixed(2)}）です。撃ち合いの前に遮蔽物を挟む、1人だけ前に出ず味方がトレードできる距離を保つ、有利なアングルを取れない場面は無理に勝負せず引いて情報を取る、を意識してみてください。`, Math.min(1, (1 - kdR) * 2));
    else if (kdR > 1.08) add('good', 'K/Dが平均を上回っている',
      `K/D は ${me.kd.toFixed(2)}（全体平均 ${avg.kd.toFixed(2)}）です。倒す数に対して落ちる数が少なく、撃ち合いの選択が安定しています。`, Math.min(1, (kdR - 1) * 2));

    const adrR = avg.adr ? me.adr / avg.adr : 1;
    if (adrR < 0.92) add('warn', '与ダメージが少なめ',
      `ADR は ${f(me.adr)}（全体平均 ${f(avg.adr)}）です。倒し切れなくても相手を削っておくと、味方のトレードが成立しやすくなります。アビリティによるダメージや、撃ち合いで一発入れてから引く動きも取り入れてみてください。`, Math.min(1, (1 - adrR) * 2));
    else if (adrR > 1.08) add('good', '与ダメージが高い',
      `ADR は ${f(me.adr)}（全体平均 ${f(avg.adr)}）です。継続的にダメージを出せており、ラウンドを通して相手に圧力をかけられています。`, Math.min(1, (adrR - 1) * 2));

    if (me.dd < avg.dd - 8) add('warn', 'ダメージ収支がマイナス',
      `1ラウンドあたりのダメージ差は ${me.dd >= 0 ? '+' : ''}${f(me.dd)}（全体平均 ${avg.dd >= 0 ? '+' : ''}${f(avg.dd)}）で、受けるダメージが与えるダメージを上回っています。相手の射線に身をさらす時間を減らす（射線管理を徹底する）、ジグルピークで情報を取る、などで改善できます。`, Math.min(1, (avg.dd - me.dd) / 50));
    else if (me.dd > avg.dd + 8) add('good', 'ダメージ収支がプラス',
      `1ラウンドあたりのダメージ差は ${me.dd >= 0 ? '+' : ''}${f(me.dd)}（全体平均 ${avg.dd >= 0 ? '+' : ''}${f(avg.dd)}）です。有利な状況で撃ち合えており、受けるダメージより与えるダメージが上回っています。`, Math.min(1, (me.dd - avg.dd) / 50));

    const rwrGap = me.rwr - avg.rwr;
    if (rwrGap < -5) {
      const carry = avg.acs && me.acs >= avg.acs * 1.05;
      add('warn', 'ラウンド勝率が低め',
        `ラウンド勝率は ${f(me.rwr)}%（全体平均 ${f(avg.rwr)}%）です。` + (carry
          ? '個人成績は高いのに勝ちに繋がっていません。味方との連携のためのコールやエコラウンド、ウルトラウンドの判断、人数有利の場面での立ち回りなど、キル以外のマクロ的な勝ち筋を意識してみてください。'
          : '個人の撃ち合いだけでなく、味方との役割分担やトレードの距離、エコラウンド、ウルトラウンドなど、チームとしての動きも見直してみてください。'),
        Math.min(1, -rwrGap / 20));
    } else if (rwrGap > 5) add('good', 'ラウンドを取れている',
      `ラウンド勝率は ${f(me.rwr)}%（全体平均 ${f(avg.rwr)}%）です。個人の成績だけでなく、チームとしての連携が取れており勝ちに繋がっています。`, Math.min(1, rwrGap / 20));
  }

  // --- オープニングデュエル ---
  if (t.matches >= 3) {
    const perMatch = (t.fk - t.fd) / t.matches;
    if (perMatch <= -0.7) add('warn', '最初の撃ち合いで落ちやすい',
      `FK ${t.fk} / FD ${t.fd}（1試合あたり ${f(perMatch)}）と、ラウンド最初の撃ち合いで先に倒される場面が目立ちます。デュエリストであれば、フラッシュなどを味方に要求し合わせて入る。それ以外のロールであれば「リスクをとるべきシチュエーションなのか」を意識して立ち回りを改善することが必要です。`, Math.min(1, -perMatch / 3));
    else if (perMatch >= 0.7) add('good', '先制キルが多い',
      `FK ${t.fk} / FD ${t.fd}（1試合あたり +${f(perMatch)}）と、最初の撃ち合いで優位に立てています。味方が続けて入りやすい展開を作れています。`, Math.min(1, perMatch / 3));
  }

  // --- アタック/ディフェンスの差 ---
  const atk = profile.side.attack, def = profile.side.defense;
  if (atk.rounds >= 40 && def.rounds >= 40 && atk.acs > 0 && def.acs > 0) {
    const sr = atk.acs / def.acs;
    if (sr < 0.85) add('warn', 'アタック側が弱め',
      `ACS はアタック ${f(atk.acs)} / ディフェンス ${f(def.acs)} と、アタック側が下がります。攻めでは単独行動を避けて味方との距離感を意識すること、ポストプラントのポジションを事前に決めておく、といった形を固めると安定しやすくなります。`, Math.min(1, (1 - sr) * 2));
    else if (sr > 1.18) add('warn', 'ディフェンス側が弱め',
      `ACS はアタック ${f(atk.acs)} / ディフェンス ${f(def.acs)} と、ディフェンス側が下がります。同じ場所で待ちすぎない、情報を取ったら素早くローテーションやプッシュの判断をする、リテイク時は味方と合わせる、といった点を見直してみてください。`, Math.min(1, (sr - 1) * 2));
  }

  // --- マップ別 ---
  const mapRows = profile.maps.filter(m => m.matches >= 3);
  if (mapRows.length) {
    const worst = mapRows.reduce((b, m) => (m.win_rate < b.win_rate ? m : b), mapRows[0]);
    const best = mapRows.reduce((b, m) => (m.win_rate > b.win_rate ? m : b), mapRows[0]);
    if (worst.win_rate <= 40) add('warn', `${worst.label} での勝率が低い`,
      `${worst.label} は ${worst.matches}試合で勝率 ${f(worst.win_rate)}%（${worst.wins}勝${worst.losses}敗）です。下の「Kill / Death Map」でこのマップを選び、デスが集中している場所や、勝てていないアングルを確認してみてください。`, Math.min(1, (50 - worst.win_rate) / 30));
    if (best.win_rate >= 65 && best.label !== worst.label) add('good', `${best.label} が得意`,
      `${best.label} は ${best.matches}試合で勝率 ${f(best.win_rate)}%（${best.wins}勝${best.losses}敗）です。得意マップでの立ち回りを、他のマップにも応用できないか振り返ってみてください。`, Math.min(1, (best.win_rate - 50) / 30));
  }

  // --- エージェント別 ---
  const agRows = profile.agents.filter(a => a.matches >= 3);
  if (agRows.length >= 2 && t.acs > 0) {
    const bestAg = agRows.reduce((b, a) => (a.acs > b.acs ? a : b), agRows[0]);
    const worstAg = agRows.reduce((b, a) => (a.acs < b.acs ? a : b), agRows[0]);
    if (bestAg.acs >= t.acs * 1.1) add('info', `${bestAg.label} で成績が伸びる`,
      `${bestAg.label} では ${bestAg.matches}試合で ACS ${f(bestAg.acs)}（通算 ${f(t.acs)}）と、通算より高い成績です。選択肢に迷うときの軸にしてみてください。同ロールのエージェントを伸ばしていくのもおすすめです。`, 0.3);
    if (worstAg.label !== bestAg.label && worstAg.acs <= t.acs * 0.85) add('info', `${worstAg.label} は成績が伸び悩み`,
      `${worstAg.label} では ${worstAg.matches}試合で ACS ${f(worstAg.acs)}（通算 ${f(t.acs)}）と、通算より低めです。プロの試合を参考に、スキルの使いどころや立ち回りを見直すか、他のエージェント・ロールとの使い分けを検討してみてください。`, 0.3);
  }

  // --- 直近の調子 ---
  const hist = profile.history;
  if (hist.length >= 6) {
    const k = Math.min(5, Math.floor(hist.length / 2));
    const recent = hist.slice(-k), before = hist.slice(0, -k);
    const avgOf = (arr) => arr.reduce((a, h) => a + h.acs, 0) / arr.length;
    const rA = avgOf(recent), bA = avgOf(before);
    if (bA > 0) {
      const tr = rA / bA;
      if (tr >= 1.12) add('good', '直近の調子が上向き',
        `直近${k}試合の平均ACSは ${f(rA)} で、それ以前（${f(bA)}）より上がっています。今の感覚や練習内容を続けてみてください。`, Math.min(1, tr - 1));
      else if (tr <= 0.88) add('warn', '直近の調子が下降気味',
        `直近${k}試合の平均ACSは ${f(rA)} で、それ以前（${f(bA)}）より下がっています。連戦で疲れていないか、エージェントやプレイスタイルを変えていないかを振り返り、短い休憩やウォームアップを挟んでみてください。`, Math.min(1, 1 - tr));
    }
  }

  items.sort((a, b) => b.score - a.score);
  const pick = (kind, n) => items.filter(i => i.kind === kind).slice(0, n);
  return [...pick('warn', 6), ...pick('good', 4), ...pick('info', 2)];
}

function AdviceSection({ profile, matches, puuid }) {
  const me = radarStats(matches, puuid);
  const avg = radarStats(matches, null);
  const peers = new Set();
  matches.forEach(m => m.dashboard.players.forEach(pl => peers.add(pl.puuid)));
  const hasPeers = peers.size >= 2;
  const items = buildAdvice(profile, me, avg, hasPeers);

  const KINDS = {
    warn: { label: '改善ポイント', color: '#F5A623' },
    good: { label: '強み', color: '#4ADE80' },
    info: { label: '傾向', color: '#5CC8FF' },
  };
  const notes = [];
  if (profile.total.matches < 5) notes.push(`試合数が${profile.total.matches}試合と少ないため、参考程度にご覧ください。`);
  if (!hasPeers) notes.push('比較対象のプレイヤーがいないため、全体平均との比較は行っていません。');

  return (
    <div>
      {notes.map((n, i) => <p key={i} style={{ fontSize: '12px', color: '#8B9AA8', margin: '0 0 10px' }}>※ {n}</p>)}
      {items.length === 0 ? (
        <p style={{ fontSize: '13px', color: '#9FA8B0', margin: 0 }}>
          全体平均と比べて、大きく見劣りする指標や際立った強みは見当たりませんでした。試合数が増えると、より具体的なアドバイスが出ます。
        </p>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '12px' }}>
          {items.map((it, i) => {
            const k = KINDS[it.kind];
            return (
              <div key={i} style={{ borderLeft: `3px solid ${k.color}`, background: `${k.color}0D`, borderRadius: '0 6px 6px 0', padding: '12px 14px' }}>
                <div style={{ fontSize: '10px', fontWeight: 700, color: k.color, letterSpacing: '0.08em', textTransform: 'uppercase' }}>{k.label}</div>
                <div style={{ fontSize: '15px', fontWeight: 700, color: '#F2F5F7', margin: '2px 0 6px' }}>{it.title}</div>
                <div style={{ fontSize: '13px', color: '#B4BEC8', lineHeight: 1.7 }}>{it.text}</div>
              </div>
            );
          })}
        </div>
      )}
      <p style={{ fontSize: '11px', color: '#4A545E', marginTop: '10px' }}>
        このアドバイスはスタッツをもとに全体平均や自身の他の成績と比べて自動で作成しています（選択中のモードの試合が対象）。あくまで目安としてご活用ください。
      </p>
    </div>
  );
}

// ---------- 個人ページ用: レーダーチャート ----------

// 各軸の目盛り（中心 = min、外周 = max）。プレイ環境に合わせてここを調整してください
const RADAR_AXES = [
  { key: 'rwr', label: 'ラウンド勝率', min: 30,  max: 70,  fmt: (v) => `${r1(v)}%` },
  { key: 'acs', label: 'ACS',          min: 100, max: 350, fmt: (v) => `${r1(v)}` },
  { key: 'kd',  label: 'K/D',          min: 0.5, max: 2.0, fmt: (v) => v.toFixed(2) },
  { key: 'adr', label: 'ADR',          min: 80,  max: 200, fmt: (v) => `${r1(v)}` },
  { key: 'hs',  label: 'HS%',          min: 5,   max: 35,  fmt: (v) => `${r1(v)}%` },
  { key: 'dd',  label: 'ダメージ差/R', min: -50, max: 50,  fmt: (v) => `${v >= 0 ? '+' : ''}${r1(v)}` },
];

// puuid を渡すとそのプレイヤー、null なら全プレイヤー合算（= 全体平均）
function radarStats(matches, puuid) {
  const acc = emptyAcc();
  let roundsWon = 0, count = 0;
  matches.forEach(m => {
    const d = m.dashboard;
    d.players.forEach(pl => {
      if (puuid && pl.puuid !== puuid) return;
      addRaw(acc, pl.raw);
      const own = d.teams[String(pl.team).toLowerCase()] || {};
      roundsWon += own.rounds_won || 0;
      count += 1;
    });
  });
  const f = finalizeAcc(acc);
  if (!count || !f.rounds) return null;
  return {
    rwr: 100 * roundsWon / f.rounds,
    acs: f.acs, kd: Number(f.kd), adr: f.adr, hs: f.hs_pct,
    dd: f.adr - f.dpr_received,
    ddTotal: acc.damage_made - acc.damage_received,
  };
}

function RadarSection({ puuid, matches }) {
  const [showAvg, setShowAvg] = useState(true);
  const me = radarStats(matches, puuid);
  const avg = radarStats(matches, null);
  if (!me) return <p style={{ fontSize: '12px', color: '#6B7885', margin: 0 }}>集計できるデータがありません。</p>;

  const W = 380, H = 330, cx = W / 2, cy = 165, R = 105;
  const n = RADAR_AXES.length;
  const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const norm = (ax, v) => Math.max(0, Math.min(1, (v - ax.min) / (ax.max - ax.min)));
  const pt = (i, t) => [cx + R * t * Math.cos(ang(i)), cy + R * t * Math.sin(ang(i))];
  const poly = (stats) => RADAR_AXES.map((ax, i) => pt(i, norm(ax, stats[ax.key])).join(',')).join(' ');
  const ring = (t) => RADAR_AXES.map((_, i) => pt(i, t).join(',')).join(' ');

  const MINE = '#9B8CFF', AVG = '#8B9AA8';
  const th = { textAlign: 'right', padding: '6px 10px', color: '#6B7885', fontWeight: 700, fontSize: '11px', textTransform: 'uppercase', whiteSpace: 'nowrap' };
  const td = { padding: '8px 10px', textAlign: 'right', color: '#9FA8B0', whiteSpace: 'nowrap', fontSize: '13px' };

  return (
    <div style={{ display: 'flex', gap: '24px', alignItems: 'center', flexWrap: 'wrap' }}>
      <div style={{ flex: '0 1 380px', minWidth: '280px', width: '100%', maxWidth: '380px' }}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
          {[0.25, 0.5, 0.75, 1].map(t => (
            <polygon key={t} points={ring(t)} fill="none" stroke={t === 1 ? '#2A333B' : '#1E262E'} strokeWidth="1" />
          ))}
          {RADAR_AXES.map((ax, i) => {
            const [ex, ey] = pt(i, 1);
            const [lx, ly] = pt(i, 1.2);
            const c = Math.cos(ang(i));
            const anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
            return (
              <g key={ax.key}>
                <line x1={cx} y1={cy} x2={ex} y2={ey} stroke="#1E262E" strokeWidth="1" />
                <text x={lx} y={ly - 2} textAnchor={anchor} fontSize="12" fontWeight="700" fill="#C7D0D8">{ax.label}</text>
                <text x={lx} y={ly + 12} textAnchor={anchor} fontSize="11" fill={MINE}>{ax.fmt(me[ax.key])}</text>
              </g>
            );
          })}
          {showAvg && avg && (
            <polygon points={poly(avg)} fill={AVG} fillOpacity="0.10" stroke={AVG} strokeWidth="1.5" strokeDasharray="5,4" />
          )}
          <polygon points={poly(me)} fill={MINE} fillOpacity="0.28" stroke={MINE} strokeWidth="2" />
          {RADAR_AXES.map((ax, i) => {
            const [px, py] = pt(i, norm(ax, me[ax.key]));
            return <circle key={ax.key} cx={px} cy={py} r="3.5" fill={MINE} stroke="#0a0d12" strokeWidth="1.5">
              <title>{`${ax.label}: ${ax.fmt(me[ax.key])}`}</title>
            </circle>;
          })}
        </svg>
        <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', fontSize: '12px', color: '#8B9AA8', flexWrap: 'wrap' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
            <span style={{ width: '14px', height: '3px', background: MINE, display: 'inline-block' }} />このプレイヤー
          </span>
          <span onClick={() => setShowAvg(v => !v)} style={{ display: 'flex', alignItems: 'center', gap: '6px', cursor: 'pointer', opacity: showAvg ? 1 : 0.4 }} title="クリックで表示切替">
            <span style={{ width: '14px', borderTop: `2px dashed ${AVG}`, display: 'inline-block' }} />全体平均
          </span>
        </div>
      </div>

      <div style={{ flex: '1 1 340px', minWidth: '300px', overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: '1px solid #1E262E' }}>
              <th style={{ ...th, textAlign: 'left' }}>指標</th>
              <th style={th}>本人</th><th style={th}>全体平均</th><th style={th}>差</th><th style={th}>目盛り</th>
            </tr>
          </thead>
          <tbody>
            {RADAR_AXES.map(ax => {
              const diff = avg ? me[ax.key] - avg[ax.key] : null;
              return (
                <tr key={ax.key} style={{ borderBottom: '1px solid #161B21' }}>
                  <td style={{ ...td, textAlign: 'left', color: '#EDEFF2', fontWeight: 600 }}>{ax.label}</td>
                  <td style={{ ...td, color: '#EDEFF2', fontWeight: 700 }}>{ax.fmt(me[ax.key])}</td>
                  <td style={td}>{avg ? ax.fmt(avg[ax.key]) : '-'}</td>
                  <td style={{ ...td, fontWeight: 600, color: diff == null ? '#6B7885' : diff >= 0 ? '#4ADE80' : '#FF6B6B' }}>
                    {diff == null ? '-' : `${diff >= 0 ? '+' : ''}${ax.key === 'kd' ? diff.toFixed(2) : r1(diff)}`}
                  </td>
                  <td style={{ ...td, color: '#5A6570', fontSize: '11px' }}>{ax.min} – {ax.max}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <p style={{ fontSize: '11px', color: '#4A545E', marginTop: '8px', lineHeight: 1.6 }}>
          ラウンド勝率 = 所属チームの勝利ラウンド数 ÷ ラウンド数 · ダメージ差/R = (与ダメ − 被ダメ) ÷ ラウンド数（通算は {me.ddTotal >= 0 ? '+' : ''}{me.ddTotal}）<br />
          レーダーは「目盛り」の範囲を中心〜外周として描画しています。全体平均は、選択中のモードの全試合の全プレイヤーを合算した値です
        </p>
      </div>
    </div>
  );
}

// ---------- 個人ページ用: マップ別 キル/デス位置 ----------

function PlayerPositionMap({ profile, mapMetaCache, setMapMetaCache }) {
  const mapNames = profile.maps.map(m => m.label).filter(n => profile.positionsByMap[n]);
  const [selMap, setSelMap] = useState(null);
  const [posSide, setPosSide] = useState('total');
  const [showKills, setShowKills] = useState(true);
  const [showDeaths, setShowDeaths] = useState(true);
  const [showLinks, setShowLinks] = useState(false);
  const [viewMode, setViewMode] = useState('points');
  const [hover, setHover] = useState(null);

  // プレイヤーやモードの切り替えで選択中のマップが無くなった場合は、最多出場マップに戻す
  const mapName = mapNames.includes(selMap) ? selMap : mapNames[0];
  const cacheEntry = mapName ? mapMetaCache[mapName] : null;

  React.useEffect(() => {
    if (!mapName || mapMetaCache[mapName]) return;
    setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'loading' } }));
    fetch('https://valorant-api.com/v1/maps')
      .then(res => res.json())
      .then(json => {
        const found = (json.data || []).find(m => m.displayName === mapName);
        if (!found || !found.displayIcon) {
          setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'error', message: 'マップ画像が見つかりませんでした' } }));
          return;
        }
        setMapMetaCache(prev => ({
          ...prev,
          [mapName]: {
            status: 'ready', displayIcon: found.displayIcon,
            xMultiplier: found.xMultiplier, yMultiplier: found.yMultiplier,
            xScalarToAdd: found.xScalarToAdd, yScalarToAdd: found.yScalarToAdd,
          },
        }));
      })
      .catch(err => {
        setMapMetaCache(prev => ({ ...prev, [mapName]: { status: 'error', message: String(err) } }));
      });
  }, [mapName]);

  if (!mapName) {
    return <p style={{ fontSize: '12px', color: '#6B7885', margin: 0 }}>位置データのある試合がありません。</p>;
  }

  const pos = profile.positionsByMap[mapName];
  const filterBySide = (arr) => posSide === 'total' ? arr : arr.filter(e => e.side === posSide);
  const kills = filterBySide(pos.kills);
  const deaths = filterBySide(pos.deaths);
  const mapRow = profile.maps.find(m => m.label === mapName);

  const chip = (active, color, onClick, label, key) => (
    <div key={key} onClick={onClick} style={{
      padding: '6px 12px', borderRadius: '4px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
      border: `1px solid ${active ? color : '#2A333B'}`,
      color: active ? color : '#5A6570',
      background: active ? `${color}14` : 'transparent', whiteSpace: 'nowrap',
    }}>{label}</div>
  );

  const mapSelect = (
    <select value={mapName} onChange={(e) => { setSelMap(e.target.value); setHover(null); }} style={{
      padding: '8px 10px', borderRadius: '4px', border: '1px solid #2A333B', background: '#12171D',
      color: '#EDEFF2', fontSize: '13px', fontFamily: 'inherit', minWidth: '180px',
    }}>
      {mapNames.map(n => {
        const row = profile.maps.find(m => m.label === n);
        return <option key={n} value={n}>{n}（{row ? row.matches : 0}試合）</option>;
      })}
    </select>
  );

  let body;
  if (!cacheEntry || cacheEntry.status === 'loading') {
    body = <div style={{ padding: '40px', textAlign: 'center', color: '#6B7885', fontSize: '13px' }}>マップデータを読み込み中（valorant-api.com）...</div>;
  } else if (cacheEntry.status === 'error') {
    body = <div style={{ padding: '20px', color: '#FF9B9B', fontSize: '13px' }}>マップデータの取得に失敗しました: {cacheEntry.message}</div>;
  } else {
    body = (
      <div style={{
        position: 'relative', border: '1px solid #1E262E', borderRadius: '6px', overflow: 'hidden',
        background: '#0D1117', width: '100%', maxWidth: '560px', aspectRatio: '1 / 1',
      }}>
        <img src={cacheEntry.displayIcon} alt={mapName + ' minimap'} style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }} />

        {viewMode === 'heatmap' && (
          <HeatmapCanvas points={[
            ...(showKills ? kills.map(k => projectToNorm(k.x, k.y, cacheEntry)) : []),
            ...(showDeaths ? deaths.map(d => projectToNorm(d.x, d.y, cacheEntry)) : []),
          ]} />
        )}

        {viewMode === 'points' && (
          <svg viewBox="0 0 1 1" style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }}>
            {showDeaths && deaths.map((d, i) => {
              const [nx, ny] = projectToNorm(d.x, d.y, cacheEntry);
              const hasEnemy = showLinks && d.enemyX != null && d.enemyY != null;
              const [enx, eny] = hasEnemy ? projectToNorm(d.enemyX, d.enemyY, cacheEntry) : [null, null];
              const r = 0.007;
              return (
                <g key={'d' + i}>
                  {hasEnemy && <line x1={nx} y1={ny} x2={enx} y2={eny} stroke="#FF3B3B" strokeOpacity="0.4" strokeWidth="0.0015" strokeDasharray="0.006,0.005" />}
                  {hasEnemy && <circle cx={enx} cy={eny} r="0.0055" fill="none" stroke="#8B9AA8" strokeWidth="0.0016" />}
                  <g onMouseEnter={() => setHover({ type: 'death', data: d })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }}>
                    <line x1={nx - r} y1={ny - r} x2={nx + r} y2={ny + r} stroke="#FF3B3B" strokeWidth={r * 0.4} strokeLinecap="round" />
                    <line x1={nx - r} y1={ny + r} x2={nx + r} y2={ny - r} stroke="#FF3B3B" strokeWidth={r * 0.4} strokeLinecap="round" />
                  </g>
                </g>
              );
            })}
            {showKills && kills.map((k, i) => {
              const [nx, ny] = projectToNorm(k.x, k.y, cacheEntry);
              const hasEnemy = showLinks && k.enemyX != null && k.enemyY != null;
              const [enx, eny] = hasEnemy ? projectToNorm(k.enemyX, k.enemyY, cacheEntry) : [null, null];
              return (
                <g key={'k' + i}>
                  {hasEnemy && <line x1={nx} y1={ny} x2={enx} y2={eny} stroke="#4ADE80" strokeOpacity="0.4" strokeWidth="0.0015" strokeDasharray="0.006,0.005" />}
                  {hasEnemy && <circle cx={enx} cy={eny} r="0.0055" fill="none" stroke="#8B9AA8" strokeWidth="0.0016" />}
                  <circle cx={nx} cy={ny} r="0.006" fill="#4ADE80" fillOpacity="0.9" stroke="#0D1116" strokeWidth="0.0013"
                    onMouseEnter={() => setHover({ type: 'kill', data: k })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }} />
                </g>
              );
            })}
          </svg>
        )}

        {viewMode === 'points' && hover && (
          <div style={{
            position: 'absolute', top: '10px', left: '10px',
            background: '#0D1116EE', border: `1px solid ${hover.type === 'kill' ? '#4ADE80' : '#FF6B6B'}`,
            borderRadius: '4px', padding: '8px 12px', fontSize: '12px', lineHeight: 1.6, pointerEvents: 'none', maxWidth: '280px',
          }}>
            <div style={{ fontWeight: 700, color: hover.type === 'kill' ? '#4ADE80' : '#FF6B6B', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
              {hover.type === 'kill' ? 'Kill' : 'Death'} — Round {hover.data.round + 1}{hover.data.t != null ? ` · ${fmtRoundTime(hover.data.t)}` : ''}
            </div>
            <div style={{ color: '#C7D0D8' }}>
              {hover.type === 'kill'
                ? `→ ${hover.data.victim} (${hover.data.weapon || '不明'})`
                : `${hover.data.killer} → (${hover.data.weapon || '不明'})`}
            </div>
            <div style={{ color: '#6B7885' }}>{formatDate(hover.data.ts)} · {hover.data.agent} · {SIDE_LABEL[hover.data.side] || ''}</div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '10px' }}>
        {mapSelect}
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
          {['total', 'attack', 'defense'].map(sd => chip(posSide === sd, SIDE_ACCENT[sd], () => setPosSide(sd), SIDE_LABEL[sd], sd))}
        </div>
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
          {chip(showKills, '#4ADE80', () => setShowKills(v => !v), `Kills (${kills.length})`, 'k')}
          {chip(showDeaths, '#FF6B6B', () => setShowDeaths(v => !v), `Deaths (${deaths.length})`, 'd')}
        </div>
      </div>
      <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '10px' }}>

      </div>

    </div>
  );
}

function MatchDashboardApp() {
  const [matches, setMatches] = useState([]); // [{ id, fileName, dashboard, raw }]
  const [error, setError] = useState(null);
  const [showUpload, setShowUpload] = useState(false);
  const [activeTab, setActiveTab] = useState('aggregate'); // 'aggregate' | match id
  const [side, setSide] = useState('total');
  const [sortKey, setSortKey] = useState('acs');
  const [sortDir, setSortDir] = useState('desc');
  const [aggSortKey, setAggSortKey] = useState('acs');
  const [aggSortDir, setAggSortDir] = useState('desc');
  const [matchView, setMatchView] = useState('stats'); // 'stats' | 'positions'
  const [modeFilter, setModeFilter] = useState('all'); // 'all' | mode key
  const [playerView, setPlayerView] = useState(null); // puuid | null
  const [mapMetaCache, setMapMetaCache] = useState({}); // displayName -> { status, ...transform, displayIcon }
  const [apiLoading, setApiLoading] = useState(false);

  const processMatchJson = (json, fileName) => {
    const dashboard = buildDashboardData(json);
    return {
      id: (dashboard.matchId || fileName || Math.random().toString(36)) + '_' + Math.random().toString(36).slice(2, 7),
      fileName,
      dashboard,
      raw: json,
    };
  };

  const commitNewMatches = (newMatches, errors) => {
    if (newMatches.length) {
      setMatches(prev => {
        const existingIds = new Set(prev.map(m => m.dashboard.matchId).filter(Boolean));
        const deduped = newMatches.filter(m => !m.dashboard.matchId || !existingIds.has(m.dashboard.matchId));
        return [...prev, ...deduped];
      });
      setShowUpload(false);
      setActiveTab('aggregate');
    }
    if (errors && errors.length) setError(errors.join(' / '));
    else setError(null);
  };

  const handleFiles = useCallback((files) => {
    setError(null);
    const csvFiles = files.filter(f => /\.csv$/i.test(f.name));
    if (csvFiles.length) {
      Promise.all(csvFiles.map(f => f.text().then(t => [f.name, t]))).then(list => {
        const errs = [], nm = [];
        try {
          csvRebuildMatches(list).forEach(mj => {
            try { nm.push(processMatchJson(mj, 'CSV:' + csvMatchId(mj))); } catch (err) { errs.push(err.message); }
          });
        } catch (err) { errs.push(err.message); }
        commitNewMatches(nm, errs);
      });
      files = files.filter(f => !/\.csv$/i.test(f.name));
      if (!files.length) return;
    }
    let pending = files.length;
    const newMatches = [];
    const errors = [];

    files.forEach((file) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) {
            // exported bundle: array of raw match jsons
            parsed.forEach((mj, idx) => {
              try {
                newMatches.push(processMatchJson(mj, `${file.name}#${idx + 1}`));
              } catch (err) {
                errors.push(`${file.name}#${idx + 1}: ${err.message}`);
              }
            });
          } else if (parsed && Array.isArray(parsed.data) && parsed.data.length > 1) {
            // APIレスポンスをそのまま保存したファイル（複数試合入り）
            parsed.data.forEach((matchObj, idx) => {
              try {
                newMatches.push(processMatchJson({ status: parsed.status, data: [matchObj] }, `${file.name}#${idx + 1}`));
              } catch (err) {
                errors.push(`${file.name}#${idx + 1}: ${err.message}`);
              }
            });
          } else {
            newMatches.push(processMatchJson(parsed, file.name));
          }
        } catch (err) {
          errors.push(`${file.name}: ${err.message}`);
        } finally {
          pending -= 1;
          if (pending === 0) commitNewMatches(newMatches, errors);
        }
      };
      reader.onerror = () => {
        errors.push(`${file.name}: 読み込みに失敗しました`);
        pending -= 1;
        if (pending === 0) commitNewMatches(newMatches, errors);
      };
      reader.readAsText(file);
    });
  }, []);

  const handleFetchApi = useCallback(async (params) => {
    let { name, tag, region, apiKey, size, mode } = params;
    setError(null);
    setApiLoading(true);

    // "名前#タグ" を名前欄にまとめて入力してしまった場合の補正
    name = (name || '').trim();
    tag = (tag || '').trim().replace(/^#/, '');
    if (name.includes('#')) {
      const i = name.lastIndexOf('#');
      if (!tag) tag = name.slice(i + 1).trim();
      name = name.slice(0, i).trim();
    }
    const headers = apiKey ? { Authorization: apiKey } : {};

    const diagnoseNotFound = async () => {
      try {
        const r = await fetch(`https://api.henrikdev.xyz/valorant/v2/account/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`, { headers });
        if (r.ok) {
          const aj = await r.json();
          const acctRegion = aj && aj.data && aj.data.region;
          let msg = ' → 診断: このRiot IDのアカウント自体は存在します';
          if (acctRegion) msg += `（アカウントのリージョン: ${acctRegion}）`;
          msg += '。';
          if (acctRegion && acctRegion !== region) msg += `選択中のリージョン（${region}）と違うので、${acctRegion}に変えて試してください。`;
          else msg += '試合の検索で見つからなかったため、モード指定を外す・別のモードにする、またはその試合がAPI側に保存されていない可能性があります。';
          return msg;
        }
        if (r.status === 404) return ' → 診断: Riot ID（名前#タグ）が見つかりません。綴り・全角半角・タグを確認してください（名前欄とタグ欄は分けて入力）。';
        return ` → 診断: アカウント確認も失敗しました（HTTP ${r.status}）`;
      } catch (e) {
        return '';
      }
    };

    try {
      const url = `https://api.henrikdev.xyz/valorant/v3/matches/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}?size=${size}${mode ? '&mode=' + encodeURIComponent(mode) : ''}`;
      const res = await fetch(url, { headers });
      if (!res.ok) {
        const bodyText = await res.text().catch(() => '');
        let apiMsg = bodyText.slice(0, 200);
        try {
          const j = JSON.parse(bodyText);
          if (j && j.errors && j.errors[0]) apiMsg = `${j.errors[0].message}（APIコード ${j.errors[0].code}）`;
        } catch (e) { /* keep raw text */ }
        const httpErr = new Error(apiMsg);
        httpErr.httpStatus = res.status;
        throw httpErr;
      }
      const json = await res.json();
      const matchList = (Array.isArray(json.data) ? json.data : [json.data]).filter(Boolean);
      if (!matchList.length) {
        setError('該当する試合が見つかりませんでした（モード指定: ' + (mode || 'なし') + '）。リザルトが古い場合、API側に保存されていない可能性があります。');
        return;
      }
      const newMatches = [];
      const errors = [];
      matchList.forEach((matchObj, idx) => {
        try {
          newMatches.push(processMatchJson({ status: json.status, data: [matchObj] }, `${name}#${tag}_${idx + 1}`));
        } catch (err) {
          errors.push(`試合${idx + 1}: ${err.message}`);
        }
      });
      commitNewMatches(newMatches, errors);
    } catch (err) {
      if (err.httpStatus) {
        // APIまでは届いている（= CORSの問題ではない）
        let hint = '';
        if (err.httpStatus === 404) hint = await diagnoseNotFound();
        else if (err.httpStatus === 401 || err.httpStatus === 403) hint = ' → APIキーが未入力、または無効です。';
        else if (err.httpStatus === 429) hint = ' → リクエスト制限に達しています。少し待ってから再実行してください。';
        setError(`取得に失敗しました（HTTP ${err.httpStatus}）: ${err.message}${hint}`);
      } else {
        setError('通信に失敗しました: ' + err.message + '（ネットワーク接続、またはブラウザのCORS制限の可能性があります。その場合はPythonスクリプトで取得したJSONファイルをアップロードしてください）');
      }
    } finally {
      setApiLoading(false);
    }
  }, []);

  const [autoStatus, setAutoStatus] = useState(AUTO_LOAD.enabled ? { state: 'loading' } : null);
  const autoLoad = useCallback(async (force) => {
    setAutoStatus({ state: 'loading' });
    try {
      const got = await githubFetchJsonFiles(AUTO_LOAD, force === true);
      if (got.length) handleFiles(got.map(f => new File([f.text], f.name, { type: 'application/json' })));
      setAutoStatus({ state: 'done', files: got.length });
    } catch (e) {
      setAutoStatus({ state: 'error', text: e.message });
    }
  }, []);
  React.useEffect(() => { if (AUTO_LOAD.enabled) autoLoad(); }, []);

  const handleExport = () => {
    const bundle = matches.map(m => m.raw);
    const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `valorant_matches_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleExportCsv = () => {
    csvBuildFiles(matches.map(m => m.raw)).forEach((f, i) => setTimeout(() => {
      const url = URL.createObjectURL(new Blob([f.text], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, i * 350));
  };

  const handleRemoveMatch = (id) => {
    setMatches(prev => prev.filter(m => m.id !== id));
    if (activeTab === id) setActiveTab('aggregate');
  };

  if (showUpload) {
    return <UploadScreen onFiles={handleFiles} error={error} hasExisting={matches.length > 0} onCancel={() => setShowUpload(false)} onFetchApi={handleFetchApi} apiLoading={apiLoading} />;
  }

  const modeCounts = {};
  matches.forEach(m => {
    const k = modeKeyOf(m);
    if (!modeCounts[k]) modeCounts[k] = { label: modeLabelOf(m), count: 0 };
    modeCounts[k].count += 1;
  });
  const modeKeys = Object.keys(modeCounts);
  const activeModeFilter = modeFilter !== 'all' && modeCounts[modeFilter] ? modeFilter : 'all';
  const aggMatches = activeModeFilter === 'all' ? matches : matches.filter(m => modeKeyOf(m) === activeModeFilter);

  const aggPlayers = buildAggregate(aggMatches);
  const sortedAgg = aggPlayers.slice().sort((a, b) => (aggSortDir === 'desc' ? b[aggSortKey] - a[aggSortKey] : a[aggSortKey] - b[aggSortKey]));
  const aggMvp = aggPlayers.slice().sort((a, b) => b.acs - a.acs)[0];
  const aggTopFK = aggPlayers.slice().sort((a, b) => b.fk - a.fk)[0];
  const aggTopWin = aggPlayers.filter(p => p.matches >= 2).sort((a, b) => b.win_rate - a.win_rate)[0] || aggPlayers.slice().sort((a, b) => b.win_rate - a.win_rate)[0];
  const aggRoundTypes = buildAggregateRoundTypes(aggMatches);

  const handleAggSort = (key) => {
    if (key === aggSortKey) setAggSortDir(d => (d === 'desc' ? 'asc' : 'desc'));
    else { setAggSortKey(key); setAggSortDir('desc'); }
  };

  const currentMatch = activeTab === 'aggregate' ? null : matches.find(m => m.id === activeTab);

  const headerTabs = (
    <div style={{ display: 'flex', gap: '6px', marginBottom: '20px', flexWrap: 'wrap', alignItems: 'center' }}>
      <div
        onClick={() => { setActiveTab('aggregate'); setPlayerView(null); }}
        style={{
          padding: '8px 16px', borderRadius: '4px', fontSize: '13px', fontWeight: 700,
          letterSpacing: '0.03em', cursor: 'pointer',
          border: `1px solid ${activeTab === 'aggregate' && !playerView ? '#9B8CFF' : '#2A333B'}`,
          color: activeTab === 'aggregate' && !playerView ? '#9B8CFF' : '#8B9AA8',
          background: activeTab === 'aggregate' && !playerView ? '#9B8CFF14' : 'transparent'
        }}
      >
        通算（{matches.length}試合）
      </div>
      {matches.map(m => (
        <div key={m.id} style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
          <div
            onClick={() => { setActiveTab(m.id); setMatchView('stats'); setPlayerView(null); }}
            style={{
              padding: '8px 28px 8px 16px', borderRadius: '4px', fontSize: '13px', fontWeight: 600,
              cursor: 'pointer',
              border: `1px solid ${activeTab === m.id && !playerView ? '#5CC8FF' : '#2A333B'}`,
              color: activeTab === m.id && !playerView ? '#5CC8FF' : '#8B9AA8',
              background: activeTab === m.id && !playerView ? '#5CC8FF14' : 'transparent'
            }}
          >
            {m.dashboard.map}<span style={{ marginLeft: '6px', fontSize: '11px', fontWeight: 500, opacity: 0.7 }}>{modeLabelOf(m)}</span>
          </div>
          <span
            onClick={() => handleRemoveMatch(m.id)}
            title="この試合を削除"
            style={{ position: 'absolute', right: '8px', fontSize: '13px', color: '#5A6570', cursor: 'pointer' }}
          >×</span>
        </div>
      ))}
      <div
        onClick={() => setShowUpload(true)}
        style={{
          padding: '8px 16px', borderRadius: '4px', fontSize: '13px', fontWeight: 700,
          cursor: 'pointer', border: '1px solid #2A333B', color: '#9B8CFF', background: '#9B8CFF14'
        }}
      >
        ⚙ 管理者ページ
      </div>
      {matches.length > 0 && (
        <div
          onClick={handleExport}
          style={{
            padding: '8px 16px', borderRadius: '4px', fontSize: '13px', fontWeight: 700,

        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px', borderLeft: '3px solid #9B8CFF', paddingLeft: '10px' }}>
          <span style={{ fontSize: '15px', fontWeight: 700, color: '#9B8CFF', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Site Breakdown</span>
          <span style={{ fontSize: '13px', color: '#6B7885' }}>設置サイト別のアタッカー勝率</span>
        </div>

        <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap' }}>
          <div style={{ flex: '1 1 320px', border: '1px solid #1E262E', borderRadius: '6px', padding: '16px 18px' }}>
            <div style={{ fontSize: '12px', fontWeight: 700, color: '#8B9AA8', textTransform: 'uppercase', marginBottom: '12px' }}>
              全体（{MATCH_DATA.rounds_played}ラウンド）
            </div>
            {siteKeys.map((site, idx) => {
              const s = siteOverall[site];
              const palette = ['#FF9F45', '#5CC8FF', '#4ADE80', '#F5A623'];
              const accent = site === 'None' ? '#5A6570' : palette[idx % palette.length];
              return <SiteBar key={site} label={siteLabel(site)} rounds={s.rounds} rate={s.attacker_win_rate} accent={accent} />;
            })}
          </div>

          <div style={{ flex: '1 1 380px', border: '1px solid #1E262E', borderRadius: '6px', padding: '16px 18px' }}>
            <div style={{ fontSize: '12px', fontWeight: 700, color: '#8B9AA8', textTransform: 'uppercase', marginBottom: '12px' }}>
              攻撃チーム別
            </div>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid #1E262E' }}>
                  <th style={{ textAlign: 'left', padding: '4px 8px', color: '#6B7885', fontSize: '11px', textTransform: 'uppercase' }}>チーム</th>
                  {siteKeys.map(site => (
                    <th key={site} style={{ textAlign: 'center', padding: '4px 8px', color: '#6B7885', fontSize: '11px', textTransform: 'uppercase' }}>{siteLabel(site)}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {['Red', 'Blue'].map(team => (
                  <tr key={team} style={{ borderBottom: '1px solid #161B21' }}>
                    <td style={{ padding: '8px', fontWeight: 700, color: TEAM_COLOR[team] }}>{team}</td>
                    {siteKeys.map(site => {
                      const s = siteByTeam[`${team}_${site}`];
                      return <td key={site} style={{ padding: '8px', textAlign: 'center', color: '#EDEFF2' }}>{s ? `${s.win_rate}% (${s.wins}/${s.rounds})` : '\u2014'}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div style={{ marginTop: '8px', marginBottom: '24px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px', borderLeft: '3px solid #9B8CFF', paddingLeft: '10px' }}>
          <span style={{ fontSize: '15px', fontWeight: 700, color: '#9B8CFF', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Round Type Breakdown</span>
          <span style={{ fontSize: '13px', color: '#6B7885' }}>ラウンドタイプ（ピストル/エコ/フォース/フルバイ）別の勝率（全体・チーム別）</span>
        </div>
        <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap' }}>
          <RoundTypeCard breakdown={MATCH_DATA.round_type_breakdown.overall} title={`全体（${MATCH_DATA.rounds_played * 2}チーム・ラウンド分）`} />
          <RoundTypeTeamCard byTeam={MATCH_DATA.round_type_breakdown.by_team} />
        </div>
      </div>

      <div style={{ marginTop: '8px', marginBottom: '24px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px', borderLeft: '3px solid #9B8CFF', paddingLeft: '10px' }}>
          <span style={{ fontSize: '15px', fontWeight: 700, color: '#9B8CFF', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Post-Plant Positioning</span>
          <span style={{ fontSize: '13px', color: '#6B7885' }}>プラント時点の防衛側の位置と勝率の関係</span>
        </div>
        <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap' }}>
          <PostPlantCard postPlant={MATCH_DATA.post_plant} />
        </div>
      </div>

      <p style={{ fontSize: '11px', color: '#4A545E', marginTop: '8px' }}>
        FK = そのラウンドで最初にキルを取った回数 / FD = そのラウンドで最初に落ちた回数 \u00b7 ACS = スコア \u00f7 ラウンド数 \u00b7 アタック/ディフェンスはスパイク設置チームからラウンドごとに自動判定
      </p>
      </React.Fragment>
      )}
    </div>
  );
}



</script>

    script.textContent = transformed;
    document.body.appendChild(script);
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(MatchDashboardApp));

</script>
</body>
